<!doctype html>

<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
:root {
  --bg: #0a0e15; --panel: #0f1520; --panel2: #121a27; --line: #1b2a45; --line2: #2a4372;
  --text: #e8eef6; --dim: #8a97a8; --accent: #2f6bff; --accent2: #38c8ff; --glow: rgba(47, 107, 255, .35); --cyan: #33d6ea;
  --green: #3fb950; --blue: #3b8eea; --grey: #3a3d45;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --head: "Chakra Petch", "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; color: var(--text); font: 15px/1.6 Inter, system-ui, "Segoe UI", sans-serif;
  background: var(--bg) radial-gradient(1200px 600px at 50% -10%, rgba(47, 107, 255, .22), transparent 60%) no-repeat;
  min-height: 100vh;
}
a { color: var(--accent2); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 1000px; margin: 0 auto; padding: 0 16px; }
code { color: var(--accent2); font-family: var(--mono); font-size: .92em; }

/* top bar */
.top { box-shadow: 0 0 27px rgba(47, 107, 255, 0.10), inset 0 0 10px rgba(56, 200, 255, 0.02); display: flex; align-items: center; flex-wrap: nowrap; gap: 6px; margin: 8px auto 0; padding: 10px 18px; border: 1px solid var(--line);
  border-radius: 12px; background: rgba(15, 21, 32, .85); backdrop-filter: blur(6px); position: sticky; top: 8px; z-index: 5; }
.top .brand img { height: 26px; display: block; }
.top nav { display: flex; gap: 5px; flex: 1 1 auto; justify-content: flex-end; min-width: 0; white-space: nowrap; }
.top nav a { color: var(--dim); padding: 6px 8px; font-size: 13px; border-bottom: 2px solid transparent; }
.top nav a:hover { color: var(--text); text-decoration: none; }
.top nav a.on { color: var(--text); border-bottom-color: var(--accent2); text-shadow: 0 0 9px rgba(56, 200, 255, 0.20); box-shadow: 0 6px 12px -8px var(--accent2); }
.top .actions { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line2); border-radius: 8px;
  padding: 8px 12px; color: var(--text); font-weight: 600; font-size: 13px; background: var(--panel); }
.btn { box-shadow: 0 0 12px rgba(47, 107, 255, 0.09); }
.btn:hover { border-color: var(--accent2); box-shadow: 0 0 20px rgba(56, 200, 255, 0.17); text-decoration: none; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.discord svg { color: #8c9eff; }
.top .btn + .btn { margin-left: 0; }
.top .btn { padding: 8px 12px; font-size: 13px; gap: 8px; }
.top .btn svg { width: 16px; height: 16px; }

/* hero */
.hero { text-align: center; padding: 40px 0 8px; }
.hero img { width: min(100%, 600px); height: auto; filter: drop-shadow(0 0 24px rgba(40, 110, 255, 0.17)); }
.tag { font: 700 clamp(13px, 2.4vw, 17px) var(--head); letter-spacing: .32em; text-transform: uppercase; margin: 10px 0 8px; }
.lede { color: #b7c2d0; max-width: 460px; margin: 0 auto 28px; }

/* stat cards */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
.stat { box-shadow: 0 0 28px rgba(47, 107, 255, 0.10), inset 0 0 16px rgba(56, 200, 255, 0.03); display: flex; align-items: center; gap: 18px; padding: 20px 22px; border: 1px solid var(--line2); border-radius: 12px;
  background: linear-gradient(180deg, rgba(51, 214, 234, .06), rgba(15, 21, 32, .9)); }
.stat .ico { box-shadow: 0 0 14px rgba(56, 200, 255, 0.10); width: 56px; height: 56px; border-radius: 10px; display: grid; place-items: center; flex: none;
  background: rgba(51, 214, 234, .1); border: 1px solid rgba(51, 214, 234, .25); color: var(--cyan); }
.stat.red .ico { background: rgba(47, 107, 255, .16); border-color: rgba(47, 107, 255, .45); color: #7aa5ff; }
.stat .ico svg { width: 26px; height: 26px; }
.stat b { text-shadow: 0 0 12px rgba(56, 200, 255, 0.10); display: block; font: 700 clamp(26px, 4vw, 32px)/1.1 var(--mono); font-variant-numeric: tabular-nums; }
.stat span { font: 500 12px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--cyan); }
.stat.red span { color: var(--dim); }
.overall { display: flex; align-items: center; gap: 16px; margin: 18px 0 24px; font: 500 15px var(--mono); }
.overall .bar { flex: 1; }

.bar { height: 12px; background: #172131; border-radius: 99px; overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; min-width: 0; }
.bar .m { background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 99px; box-shadow: 0 0 8px rgba(56, 200, 255, 0.20); }
.bar.g .m { background: var(--green); }
.bar.b .m { background: #f0883e; }
.bar .p { background: color-mix(in srgb, var(--green) 35%, var(--panel)); }
.bar.code .s { background: var(--blue); }
.bar.code .m { background: var(--green); box-shadow: none; }
.bar.code .s, .bar.code .m, .bar.code .p { border-radius: 0; }
.bar.code .p { background: repeating-linear-gradient(135deg, #205d38 0 5px, #173f29 5px 10px); background-size: 14px 14px; animation: progress-stripes .8s linear infinite; }
@keyframes progress-stripes { to { background-position: 14px 0; } }
@media (prefers-reduced-motion: reduce) { .bar.code .p { animation: none; } }

/* panels and sections */
.panel { box-shadow: 0 0 28px rgba(47, 107, 255, 0.09), inset 0 0 14px rgba(56, 200, 255, 0.02); border: 1px solid var(--line2); border-radius: 14px; background: rgba(15, 21, 32, .7); padding: 14px; }
.commit { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; background: var(--panel2); border-radius: 10px; padding: 12px 16px; }
.commit .ico { color: var(--accent); width: 32px; height: 32px; flex: none; }
.commit .who b { display: block; font-weight: 600; }
.commit .who small { color: var(--dim); }
.commit .msg { flex: 1; min-width: 220px; display: flex; align-items: center; gap: 12px; border: 1px solid var(--line2);
  border-radius: 8px; padding: 8px 12px; font: 13px var(--mono); color: #c3cdd9; overflow: hidden; }
.commit .msg span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hash { background: rgba(47, 107, 255, .2); color: #8fb3ff; border-radius: 6px; padding: 2px 10px; flex: none; }
.step { background: none; border: 1px solid var(--line2); color: var(--text); border-radius: 8px; width: 34px; height: 34px;
  cursor: pointer; font-size: 16px; }
.step { box-shadow: 0 0 9px rgba(47, 107, 255, 0.10); }
.step:disabled { opacity: .35; cursor: default; box-shadow: none; }

.head { display: flex; align-items: end; justify-content: space-between; gap: 24px; flex-wrap: wrap; margin: 48px 0 18px; }
.head h2 { margin: 0; padding-left: 20px; border-left: 4px solid var(--accent2); text-shadow: 0 0 14px rgba(56, 200, 255, 0.10); font: 700 clamp(26px, 5vw, 34px)/1 var(--head);
  text-transform: uppercase; letter-spacing: .02em; }
.head h2 small { display: block; font: 500 12px var(--mono); letter-spacing: .2em; color: var(--dim); margin-bottom: 6px; }
.head p { margin: 0; max-width: 560px; color: #b7c2d0; font-size: 14px; }
.warn { margin-top: 8px !important; color: #9fd8ff !important; }

/* client cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.card { box-shadow: 0 0 24px rgba(47, 107, 255, 0.09), inset 0 0 12px rgba(56, 200, 255, 0.01); position: relative; border: 1px solid var(--line2); border-radius: 12px; padding: 18px 20px 20px;
  background: linear-gradient(180deg, var(--panel2), var(--panel)); transition: border-color .15s, box-shadow .15s; }
.card:hover { border-color: rgba(56, 200, 255, .7); box-shadow: 0 0 40px rgba(56, 160, 255, 0.17), inset 0 0 18px rgba(56, 200, 255, 0.05); }
.card h3 { margin: 0 0 10px; padding-bottom: 10px; border-bottom: 1px solid var(--line2); font: 700 28px/1.1 var(--head);
  display: flex; justify-content: space-between; align-items: center; }
.card h3 a { color: var(--text); }
.card h3 a::after { content: ""; position: absolute; inset: 0; }  /* whole card opens the client page */
.card h3 .chev { color: var(--dim); font-size: 22px; }
.card .meta { color: var(--dim); font: 12px/1.6 var(--mono); min-height: 3.2em; }
.card .row { display: flex; align-items: center; gap: 12px; margin-top: 10px; font: 12px var(--mono); color: var(--dim); }
.card .row .bar { flex: 1; height: 8px; }
.card .count { font: 13px var(--mono); color: #c3cdd9; margin-top: 4px; }
.join { position: relative; z-index: 1; display: flex; justify-content: center; gap: 8px; margin-top: 16px; padding: 9px 14px;
  border: 1px solid var(--accent); border-radius: 8px; color: #fff; font-weight: 600;
  background: linear-gradient(90deg, rgba(47, 107, 255, .18), rgba(56, 200, 255, .08)); }
.join:hover { background: linear-gradient(90deg, rgba(47, 107, 255, .4), rgba(56, 200, 255, .2)); text-decoration: none; }
.join { box-shadow: 0 0 16px rgba(56, 200, 255, 0.14), inset 0 0 9px rgba(56, 200, 255, 0.06); border-color: var(--accent2) !important;
  text-shadow: 0 0 8px rgba(56, 200, 255, 0.22); }
.join:hover { box-shadow: 0 0 26px rgba(56, 200, 255, 0.22), inset 0 0 12px rgba(56, 200, 255, 0.09); }
.join.solid { display: inline-flex; background: linear-gradient(90deg, var(--accent), var(--accent2)); border: 0; padding: 10px 20px; box-shadow: 0 0 27px rgba(56, 200, 255, 0.20); }
a.join { font: inherit; cursor: pointer; }

/* tables */
.table { box-shadow: 0 0 27px rgba(47, 107, 255, 0.09); overflow-x: auto; border: 1px solid var(--line2); border-radius: 12px; background: rgba(15, 21, 32, .7); }
table { width: 100%; border-collapse: collapse; font: 13px var(--mono); }
td, th { text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
th { color: var(--dim); font: 500 13px Inter, sans-serif; }
td.user { font: 600 15px Inter, sans-serif; color: var(--cyan); }
.medal { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; font-weight: 700;
  font-size: 12px; color: #2b1d00; background: #3a4558; color: var(--text); }
.medal.m1 { background: radial-gradient(circle at 35% 30%, #ffe27a, #e0a800); color: #3b2a00; }
.medal.m2 { background: radial-gradient(circle at 35% 30%, #f2f4f7, #9aa5b4); color: #1d2430; }
.medal.m3 { background: radial-gradient(circle at 35% 30%, #f3b37c, #b5652a); color: #2e1606; }

/* client page bits */
.back { font: 14px var(--mono); display: inline-block; margin-top: 28px; }
.sub { font: 14px var(--mono); color: var(--dim); text-align: center; margin: 6px 0 16px; }
.page-title { font: 700 clamp(40px, 9vw, 64px)/1 var(--head); text-align: center; margin: 16px 0 0; }
.center { text-align: center; margin-bottom: 24px; }
.label { font-weight: 600; margin: 20px 0 6px; }
.label small { color: var(--dim); font-weight: 400; }
.controls { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
select, input { background: var(--panel); color: var(--text); border: 1px solid var(--line2); border-radius: 8px; padding: 10px 12px; font: inherit; min-width: 0; }
select { flex: 1 1 200px; }
input { flex: 2 1 240px; }
.map { position: relative; }
canvas { display: block; width: 100%; height: min(70vh, 560px); background: var(--grey); border-radius: 8px; cursor: pointer; }
.tip { position: absolute; pointer-events: none; background: #f2f3f5; color: #111; font: 12px var(--mono); padding: 3px 8px; border-radius: 4px; white-space: nowrap; display: none; }
.detail { border: 1px solid var(--line2); border-radius: 10px; background: var(--panel); padding: 12px 16px; margin-top: 12px; font: 13px var(--mono); overflow-wrap: anywhere; }
.detail a { display: inline-block; margin-top: 8px; font-family: var(--sans); }
.legend { display: flex; gap: 16px; color: var(--dim); font-size: 13px; margin-top: 8px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
.note { color: var(--dim); font: 12px var(--mono); margin-top: 12px; }
.source-list { margin-top: 20px; }
.source-list ul { margin: 10px 0 0; padding-left: 20px; }
.source-list li { margin: 7px 0; color: #c9d4e2; }
.src-state { display: inline-block; border: 1px solid; border-radius: 5px; font: 600 11px var(--mono); margin-left: 7px; padding: 1px 6px; white-space: nowrap; }
.src-state.yes { color: #3fb950; border-color: rgba(63,185,80,.4); background: rgba(63,185,80,.1); }
.src-state.no { color: #e5534b; border-color: rgba(229,83,75,.4); background: rgba(229,83,75,.1); }
.src-state.maybe { color: #d8a63a; border-color: rgba(216,166,58,.4); background: rgba(216,166,58,.1); }

/* footer */

/* footer */
footer { border-top: 1px solid var(--line); margin-top: 64px; padding: 28px 0; }
footer .wrap { display: flex; align-items: center; justify-content: space-between; gap: 18px; flex-wrap: wrap; }
footer .actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
footer img { height: 30px; }

@media (max-width: 640px) {
  .top { flex-wrap: wrap; gap: 10px; justify-content: space-between; }
  .top nav { order: 3; flex-basis: 100%; justify-content: center; white-space: normal; }
  .top nav a { padding: 4px 8px; }
  .stat { padding: 16px; }
}
</style>
</head>

const sourceInventory = name => (CLIENT_SOURCES[name] || []).map(([what, state, kind]) =>
  `<li>${esc(what)}<span class="src-state ${kind}">${esc(state)}</span></li>`).join("");
const fmt = n => n.toLocaleString("en-US");
const pct = (a, b) => b ? (100 * a / b).toFixed(2) + "%" : "0.00%";
const mb = n => (n / 1048576).toFixed(2) + " MB";
const hex = n => n.toString(16).padStart(8, "0");
const sourceUrl = (client, address) => `${FINDINGS}/blob/main/src/${encodeURIComponent(client)}/${hex(address)}.cpp`;
const libraryUrl = meta => meta && meta[0].startsWith("libpng-")
  ? `https://github.com/pnggroup/libpng/blob/v${meta[0].slice(7)}/${meta[1]}` : "";
const sourceLinks = (client, f, short = false) => {
  const library = libraryUrl(f[5]);
  const harness = f[4] ? `<a href="${sourceUrl(client, f[0])}" target="_blank" rel="noopener">${short ? "harness" : "View match harness"} ↗</a>` : "";
  if (library) return `<a href="${library}" target="_blank" rel="noopener">${short ? "C source" : "View original C source"} ↗</a>${harness ? " · " + harness : ""}`;
  return harness || "No recovered source published yet";
};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const cache = new Map();
let progress, history = [], hIdx = -1;
const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October",
                "November", "December"];
const ICON = {
  code: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M13.5 5l-3 14"/></svg>',
  file: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 2h8l6 6v12a2 2 0 01-2 2H6a2 2 0 01-2-2V4a2 2 0 012-2zm7 1.5V9h5.5L13 3.5zM8 12v2h8v-2H8zm0 4v2h8v-2H8z"/></svg>',
  chart: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="12" width="3.2" height="8" rx="1"/><rect x="10.4" y="7" width="3.2" height="13" rx="1"/><rect x="16.8" y="3" width="3.2" height="17" rx="1"/></svg>',
  branch: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="6" cy="5" r="2.5"/><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="7" r="2.5"/><path d="M6 7.5v9M18 9.5c0 4-6 3.5-11 7.5"/></svg>',
};
// Title = build year; the full build date goes in the descriptor line.
const title = c => c.built ? c.built.slice(0, 4) : c.name;
const longDate = s => { const [y, m, d] = s.split("-").map(Number); return `${MONTHS[m - 1]} ${d}, ${y}`; };
const builtOn = c => c.built ? `Built ${longDate(c.built)} · ` : "";

// Stats for a client at the selected history snapshot (latest = progress.json).
function statsFor(c) {
  const snap = history[hIdx];
  if (hIdx === history.length - 1 || !snap || !snap.clients[c.name]) return c;
  const old = snap.clients[c.name];
  return {...c, ...old, source_bytes: old.source_bytes || 0,
          mined_bytes: old.mined_bytes ?? (old.matched_bytes || 0),
          partial_bytes: old.partial_bytes || 0};
}

function bar(m, p, total, cls = "") {
  const w = 100 * m / total || 0;  // nonzero progress stays visible even at 0.4%
  return `<div class="bar ${cls}"><i class="m" style="width:${w ? `max(10px, ${w}%)` : 0}"></i>` +
         `<i class="p" style="width:${100 * p / total || 0}%"></i></div>`;
}

function codeBar(source, mined, partial, total) {
  const width = n => total ? 100 * n / total : 0;
  return `<div class="bar code"><i class="s" style="width:${width(source)}%"></i>` +
         `<i class="m" style="width:${width(mined)}%"></i><i class="p" style="width:${width(partial)}%"></i></div>`;
}

/* One click opens the console, which then asks the two things that matter:
   cloud or local model, and how the worker should run. The link only carries
   which client and which server - every other choice stays in the terminal,
   where `roc launch` repeats it later. */
function joinLink(name, short) {
  if (!progress.server) return "";
  const c = progress.clients.find(c => c.name === name) || {name};
  const q = new URLSearchParams({client: name, server: progress.server});
  return `<a class="join${short ? "" : " solid"}" href="roconstruct://work?${q}" `
       + `title="Set up a worker for ${esc(title(c))}">${
          short ? "Help out" : "Help out on " + esc(title(c))} →</a>`;
}

function joinHelp() {
  if (!progress.server) return "";
  return `<div><p><a href="${REPO}/archive/refs/heads/main.zip">Download RoConstruct</a>, unzip it, then run
    <code>install.cmd</code> &mdash; a small bootstrap that checks Python 3.12, installs two pip packages, downloads the
    exact compiler bundles and registers <code>roconstruct://</code>. It installs no Ollama, Docker or model.
    Then click "Help out": the worker starts in a console window, fetching the client exe and its compiler
    the first time. Running install.cmd again never reinstalls anything or touches your work.</p></div>`;
}

function commitPanel() {
  if (!history.length) return "";
  const s = history[hIdx], latest = hIdx === history.length - 1;
  return `<div class="panel"><div class="commit">
      <span class="ico">${ICON.branch}</span>
      <div class="who"><b>${latest ? "Latest commit" : `Commit ${hIdx + 1} of ${history.length}`}</b><small>${esc(s.date)}</small></div>
      <div class="msg">${s.commit ? `<a class="hash" href="${REPO}/commit/${esc(s.commit)}">${esc(s.commit)}</a>` : ""}
        <span>${esc(s.subject || "no commit")}</span></div>
      <button class="step" data-h="-1" title="Previous" ${hIdx ? "" : "disabled"}>‹</button>
      <button class="step" data-h="1" title="Next" ${latest ? "disabled" : ""}>›</button>
      <a class="btn" href="${REPO}/commits/main">View on GitHub</a>
    </div></div>`;
}

function wireNav() {
  app.querySelectorAll("[data-h]").forEach(b => b.onclick = () => {
    hIdx = b.dataset.h === "latest" ? history.length - 1 : hIdx + +b.dataset.h;
    route(false);
  });
}

function overview() {
  const started = progress.clients.filter(c => c.started).map(statsFor);
  const sum = k => started.reduce((a, c) => a + (c[k] || 0), 0);
  const funcs = sum("functions"), matched = sum("matched"), bytes = sum("bytes"), mbytes = sum("matched_bytes");
  const sourceBytes = sum("source_bytes"), minedBytes = sum("mined_bytes"), partialBytes = sum("partial_bytes");
  const years = progress.clients.map(title).sort();
  app.innerHTML = `
    <section class="hero">
      <img src="logo.png" alt="RoConstruct">
      <div class="tag">Old Roblox Client Decompilation</div>
      <p class="lede">A community-driven project to decompile and rebuild classic Roblox clients from
        ${esc(years[0])}–${esc(years[years.length - 1])}, preserving a piece of history.</p>
    </section>
    <div class="stats">
      <div class="stat"><div class="ico">${ICON.code}</div><div><b>${fmt(matched)}</b><span>Functions matched</span></div></div>
      <div class="stat red"><div class="ico">${ICON.file}</div><div><b>${fmt(funcs - matched)}</b><span>Remaining functions</span></div></div>
      <div class="stat"><div class="ico">${ICON.chart}</div><div><b>${pct(mbytes, bytes)}</b><span>Complete</span></div></div>
    </div>
    <div class="overall">${codeBar(sourceBytes, minedBytes, partialBytes, bytes)}<span>${pct(mbytes, bytes)}</span></div>
    ${commitPanel()}
    <div class="head" id="clients"><h2><small>Explore</small>Clients</h2>${joinHelp()}</div>
    <div class="cards">${progress.clients.map(statsFor).map(c => `
      <div class="card">
        <h3><a href="#${esc(c.name)}">${esc(title(c))}</a><span class="chev">›</span></h3>
        <div class="meta">${esc(builtOn(c))}${esc(c.compiler)}</div>
        ${c.started ? `<div class="row">${codeBar(c.source_bytes || 0, c.mined_bytes ?? c.matched_bytes, c.partial_bytes || 0, c.bytes)}<span>${pct(c.matched_bytes, c.bytes)}</span></div>
          <div class="count">${fmt(c.matched)} / ${fmt(c.functions)}</div>` : `<div class="count">not started</div>`}
        ${c.started ? joinLink(c.name, true) : ""}
      </div>`).join("")}
    </div>
    ${leaderboard(progress.leaderboard, "contributors")}
    <p class="note">Matched = compiles byte-identical with the original MSVC. Compiler-generated stubs are not counted.
      Last updated: ${esc(progress.updated)}</p>`;
  wireNav();
}

function leaderboard(all, id = "") {
  all = all || [];
  if (!all.length) return "";
  const bot = all.find(r => r.user === "auto");
  const people = all.filter(r => r.user !== "auto");
  return `<div class="head" ${id ? `id="${id}"` : ""}><h2><small>Community</small>Top contributors</h2>
      <p>Points are the total percentage improvement across all functions someone made better.
      ${bot ? `${fmt(bot.matched)} trivial functions were matched automatically by pattern (not ranked).` : ""}</p></div>
    <div class="table"><table><thead><tr><th>#</th><th>User</th><th>Matched</th><th>Points</th><th>Submissions</th></tr></thead>
    <tbody>${people.length ? people.slice(0, 20).map((r, i) => `<tr>
      <td><span class="medal ${i < 3 ? "m" + (i + 1) : ""}">${i + 1}</span></td><td class="user">${esc(r.user)}</td>
      <td>${fmt(r.matched)}</td><td>${fmt(r.points)}</td><td>${fmt(r.submissions)}</td></tr>`).join("")
      : `<tr><td colspan="5">Nobody yet. Be the first!</td></tr>`}</tbody></table></div>`;
}

// Squarified treemap: lays items ({v}) into rect, writes x,y,w,h onto each.
function squarify(items, x, y, w, h) {
  const total = items.reduce((a, it) => a + it.v, 0);
  if (!total) return;
  const scale = w * h / total;
  let i = 0;
  while (i < items.length) {
    const side = Math.min(w, h);
    let sum = 0, min = Infinity, max = 0, worst = Infinity, j = i;
    while (j < items.length) {
      const a = items[j].v * scale;
      const s = sum + a, mn = Math.min(min, a), mx = Math.max(max, a);
      const wst = Math.max(side * side * mx / (s * s), s * s / (side * side * mn));
      if (j > i && wst > worst) break;
      sum = s; min = mn; max = mx; worst = wst; j++;
    }
    const thick = sum / side;
    let off = 0;
    for (let k = i; k < j; k++) {
      const len = items[k].v * scale / thick;
      if (w >= h) Object.assign(items[k], {x: x, y: y + off, w: thick, h: len});
      else Object.assign(items[k], {x: x + off, y: y, w: len, h: thick});
      off += len;
    }
    if (w >= h) { x += thick; w -= thick; } else { y += thick; h -= thick; }
    i = j;
  }
}

// Filter tokens: <70% >1kb <200b, anything else matches address or unit name.
function parseFilter(text, units) {
  const tests = [];
  for (const tok of text.toLowerCase().split(/\s+/).filter(Boolean)) {
    const m = tok.match(/^([<>])(\d+(?:\.\d+)?)(%|kb|b)$/);
    if (!m) {
      const t = tok.replace(/^0x/, "");
      tests.push(f => hex(f[0]).includes(t) || units[f[3]].toLowerCase().includes(tok));
      continue;
    }
    const n = parseFloat(m[2]) * (m[3] === "kb" ? 1024 : 1);
    const val = m[3] === "%" ? f => f[2] : f => f[1];
    tests.push(m[1] === "<" ? f => val(f) < n : f => val(f) > n);
  }
  return f => tests.every(t => t(f));
}

function color(score, original, harness) {
  if (score === 100 && !original && !harness) return "#3a3d45";
  if (original) return "#58a6ff";
  if (!score) return "#3a3d45";
  if (score === 100) return "#3fb950";
  const t = score / 100;  // partial: grey -> green
  return `rgb(${58 + (40 - 58) * t | 0},${61 + (140 - 61) * t | 0},${69 + (60 - 69) * t | 0})`;
}

async function client(name) {
  const latest = progress.clients.find(c => c.name === name);
  if (!latest) return overview();
  if (!latest.started) {
    app.innerHTML = `<a class="back" href="#">← all clients</a><h1 class="page-title">${esc(title(latest))}</h1>
      <p class="sub">${esc(builtOn(latest))}${esc(latest.compiler)} — not started. Run <code>roc analyze ${esc(name)}</code>.</p>`;
    return;
  }
  const c = statsFor(latest);
  if (!cache.has(name)) cache.set(name, await (await fetch(`data/${encodeURIComponent(name)}.json`, {cache: "no-cache"})).json());
  const data = cache.get(name), units = data.units;
  const byUnit = new Map();
  for (const f of data.funcs) {
    if (!byUnit.has(f[3])) byUnit.set(f[3], []);
    byUnit.get(f[3]).push(f);
  }
  const unitSize = u => byUnit.get(u).reduce((a, f) => a + f[1], 0);
  const unitOrder = [...byUnit.keys()].sort((a, b) => unitSize(b) - unitSize(a));
  app.innerHTML = `
    <a class="back" href="#">← all clients</a>
    <h1 class="page-title">${esc(title(latest))}</h1>
    <p class="sub">${esc(builtOn(latest))}${esc(latest.compiler)} · ${fmt(latest.classes || 0)} classes · ${fmt(latest.generated || 0)} compiler stubs skipped</p>
    <div class="center">${joinLink(name)}</div>
    <div class="stats">
      <div class="stat"><div class="ico">${ICON.code}</div><div><b>${fmt(c.matched)}</b><span>Matched</span></div></div>
      <div class="stat"><div class="ico">${ICON.chart}</div><div><b>${fmt(c.partial)}</b><span>Partial</span></div></div>
      <div class="stat red"><div class="ico">${ICON.file}</div><div><b>${fmt(c.functions - c.matched)}</b><span>Remaining</span></div></div>
    </div>
    <div class="label">Code <small>(${mb(c.bytes)}) — ${pct(c.matched_bytes, c.bytes)}</small></div>
    ${codeBar(c.source_bytes || 0, c.mined_bytes ?? c.matched_bytes, c.partial_bytes || 0, c.bytes)}
    <div class="legend"><span><i style="background:#58a6ff"></i>original source</span><span><i style="background:#3fb950"></i>mined</span><span><i style="background:repeating-linear-gradient(135deg,#205d38 0 5px,#173f29 5px 10px)"></i>in progress</span></div>
    <div class="label">Data <small>(${mb(latest.data_bytes || 0)}) — ${pct(latest.data_matched_bytes || 0, latest.data_bytes)}
      verified (strings and constants used by matched functions)</small></div>
    ${bar(latest.data_matched_bytes || 0, 0, latest.data_bytes || 1, "b")}
    <div style="margin-top:20px">${commitPanel()}</div>
    <div class="head source-list"><h2><small>Available</small>Sources</h2><p>Exact version only where binary evidence pins it. Candidate source never counts without byte match.</p></div>
    <div class="detail"><ul>${sourceInventory(name)}</ul></div>
    <div class="head"><h2><small>Map</small>Units</h2><p>${fmt(units.length)} units (classes from RTTI). The map always shows the latest state.</p></div>
    <div class="controls">
      <select id="unit"><option value="">All</option>${unitOrder.map(u =>
        `<option value="${u}">${esc(units[u])}</option>`).join("")}</select>
      <input id="filter" placeholder="Filter, e.g.: 'Instance <70% >1kb'">
    </div>
    <div class="map"><canvas id="cv"></canvas><div class="tip" id="tip"></div></div>
    <div class="legend"><span><i style="background:#58a6ff"></i>original source</span><span><i style="background:#3fb950"></i>mined match</span>
      <span><i style="background:rgb(49,100,64)"></i>partial</span><span><i style="background:#3a3d45"></i>source pending</span></div>
    <div class="detail" id="detail">Click a tile to see its function address, match score, and recovered source.</div>
    ${leaderboard(latest.leaderboard)}
    <div class="head"><h2><small>Pick one</small>Easiest remaining</h2></div>
    <div class="table"><table><thead><tr><th>Address</th><th>Size</th><th>Score</th><th>Unit</th><th>Source</th><th>Claim</th></tr></thead>
      <tbody id="easy"></tbody></table></div>
    <p class="note">Last updated: ${esc(progress.updated)}</p>`;
  wireNav();

  const cv = document.getElementById("cv"), tip = document.getElementById("tip");
  const unitSel = document.getElementById("unit"), filter = document.getElementById("filter");
  let boxes = [], frames = [], keep = () => true;

  function layout() {
    const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1;
    cv.width = r.width * dpr; cv.height = r.height * dpr;
    const pick = unitSel.value ? [+unitSel.value] : unitOrder;
    frames = pick.map(u => ({u, v: unitSize(u)}));
    squarify(frames, 0, 0, r.width, r.height);
    boxes = [];
    for (const fr of frames) {
      const items = byUnit.get(fr.u).map(f => ({f, v: f[1]})).sort((a, b) => b.v - a.v);
      squarify(items, fr.x + 1, fr.y + 1, Math.max(fr.w - 2, 0), Math.max(fr.h - 2, 0));
      boxes.push(...items);
    }
    draw();
  }

  function draw() {
    const g = cv.getContext("2d"), dpr = devicePixelRatio || 1;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.fillStyle = "#1d1f24"; g.fillRect(0, 0, cv.width, cv.height);
    for (const b of boxes) {
      g.globalAlpha = keep(b.f) ? 1 : 0.2;
      g.fillStyle = color(b.f[2], b.f[5], b.f[4]);
      g.fillRect(b.x, b.y, b.w, b.h);
      if (b.w > 4 && b.h > 4) { g.strokeStyle = "#2a2c33"; g.lineWidth = 0.5; g.strokeRect(b.x, b.y, b.w, b.h); }
    }
    g.globalAlpha = 1;
    for (const fr of frames) { g.strokeStyle = "#16181d"; g.lineWidth = 2; g.strokeRect(fr.x, fr.y, fr.w, fr.h); }
  }

  const hit = e => {
    const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    return {x, y, b: boxes.find(b => x >= b.x && x < b.x + b.w && y >= b.y && y < b.y + b.h)};
  };
  cv.onmousemove = e => {
    const {x, y, b} = hit(e);
    if (!b) { tip.style.display = "none"; return; }
    tip.textContent = `${units[b.f[3]]} • ${hex(b.f[0])} • ${fmt(b.f[1])} B • ${b.f[2]}%` + (b.f[6] ? ` • family ${b.f[6]}` : "");
    tip.style.display = "block";
    tip.style.left = Math.max(0, Math.min(x + 12, cv.clientWidth - tip.offsetWidth)) + "px";
    tip.style.top = (y + 16) + "px";
  };
  cv.onmouseleave = () => { tip.style.display = "none"; };
  cv.onclick = e => {
    const {b} = hit(e);
    if (!b) return;
    const f = b.f;
    const source = sourceLinks(name, f);
    document.getElementById("detail").innerHTML =
      `<strong>${esc(units[f[3]])}</strong><br>${hex(f[0])} • ${fmt(f[1])} bytes • ${f[2]}% matched` +
      (f[6] ? `<br>Family: <code>${esc(f[6])}</code>` : "") + `<br>` +
      `${source}<br>Work on it: <code>roc claim ${esc(name)} ${hex(f[0])}</code>`;
  };
  unitSel.onchange = layout;
  filter.oninput = () => { keep = parseFilter(filter.value, units); draw(); };
  onresize = layout;
  layout();

  const easy = data.funcs.filter(f => f[2] < 100).sort((a, b) => a[1] - b[1] || b[2] - a[2]).slice(0, 25);
  document.getElementById("easy").innerHTML = easy.map(f =>
    `<tr><td>${hex(f[0])}</td><td>${f[1]} B</td><td>${f[2]}%</td><td>${esc(units[f[3]])}</td>` +
    `<td>${sourceLinks(name, f, true)}</td>` +
    `<td><code>roc claim ${esc(name)} ${hex(f[0])}</code></td></tr>`).join("");
}

const SECTIONS = ["clients", "contributors"];

function route(top = true) {
  onresize = null;
  const name = decodeURIComponent(location.hash.slice(1));
  const section = SECTIONS.includes(name);
  if (name && !section) client(name); else overview();
  document.querySelectorAll("[data-nav]").forEach(a =>
    a.classList.toggle("on", a.dataset.nav === (section ? name : name ? "clients" : "home")));
  if (section) document.getElementById(name)?.scrollIntoView();
  else if (top) scrollTo(0, 0);
}

Promise.all([
  fetch("progress.json", {cache: "no-cache"}).then(r => r.json()),
  fetch("history.json", {cache: "no-cache"}).then(r => r.ok ? r.json() : []).catch(() => []),
]).then(([p, h]) => {
  progress = p; history = h; hIdx = h.length - 1;
  route();
  addEventListener("hashchange", () => route());
}).catch(() => { app.textContent = "progress.json missing: run `roc progress`."; });
</script>
</body>
</html>
