<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoConstruct Progress</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --bg: #0a0e15; --panel: #0f1520; --panel2: #121a27; --line: #1b2a45; --line2: #2a4372;
  --text: #e8eef6; --dim: #8a97a8; --accent: #2f6bff; --accent2: #38c8ff; --glow: rgba(47, 107, 255, .35); --cyan: #33d6ea;
  --green: #3fb950; --blue: #3b8eea; --grey: #3a3d45;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --head: "Chakra Petch", "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
body {
  margin: 0; color: var(--text); font: 15px/1.6 Inter, system-ui, "Segoe UI", sans-serif;
  background: var(--bg) radial-gradient(1200px 600px at 50% -10%, rgba(47, 107, 255, .22), transparent 60%) no-repeat;
  min-height: 100vh;
}
a { color: var(--accent2); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 1000px; margin: 0 auto; padding: 0 16px; }
code { color: var(--accent2); font-family: var(--mono); font-size: .92em; }

/* top bar */
.top { box-shadow: 0 0 27px rgba(47, 107, 255, 0.10), inset 0 0 10px rgba(56, 200, 255, 0.02); display: flex; align-items: center; flex-wrap: nowrap; gap: 6px; margin: 8px auto 0; padding: 10px 18px; border: 1px solid var(--line);
  border-radius: 12px; background: rgba(15, 21, 32, .85); backdrop-filter: blur(6px); position: sticky; top: 8px; z-index: 5; }
.top .brand img { height: 26px; display: block; }
.top nav { display: flex; gap: 5px; flex: 1 1 auto; justify-content: flex-end; min-width: 0; white-space: nowrap; }
.top nav a { color: var(--dim); padding: 6px 8px; font-size: 13px; border-bottom: 2px solid transparent; }
.top nav a:hover { color: var(--text); text-decoration: none; }
.top nav a.on { color: var(--text); border-bottom-color: var(--accent2); text-shadow: 0 0 9px rgba(56, 200, 255, 0.20); box-shadow: 0 6px 12px -8px var(--accent2); }
.top .actions { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line2); border-radius: 8px;
  padding: 8px 12px; color: var(--text); font-weight: 600; font-size: 13px; background: var(--panel); }
.btn { box-shadow: 0 0 12px rgba(47, 107, 255, 0.09); }
.btn:hover { border-color: var(--accent2); box-shadow: 0 0 20px rgba(56, 200, 255, 0.17); text-decoration: none; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.discord svg { color: #8c9eff; }
.top .btn + .btn { margin-left: 0; }
.top .btn { padding: 8px 12px; font-size: 13px; gap: 8px; }
.top .btn svg { width: 16px; height: 16px; }

/* hero */
.hero { text-align: center; padding: 40px 0 8px; }
.hero img { width: min(100%, 600px); height: auto; filter: drop-shadow(0 0 24px rgba(40, 110, 255, 0.17)); }
.tag { font: 700 clamp(13px, 2.4vw, 17px) var(--head); letter-spacing: .32em; text-transform: uppercase; margin: 10px 0 8px; }
.lede { color: #b7c2d0; max-width: 460px; margin: 0 auto 28px; }

/* stat cards */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
.stat { box-shadow: 0 0 28px rgba(47, 107, 255, 0.10), inset 0 0 16px rgba(56, 200, 255, 0.03); display: flex; align-items: center; gap: 18px; padding: 20px 22px; border: 1px solid var(--line2); border-radius: 12px;
  background: linear-gradient(180deg, rgba(51, 214, 234, .06), rgba(15, 21, 32, .9)); }
.stat .ico { box-shadow: 0 0 14px rgba(56, 200, 255, 0.10); width: 56px; height: 56px; border-radius: 10px; display: grid; place-items: center; flex: none;
  background: rgba(51, 214, 234, .1); border: 1px solid rgba(51, 214, 234, .25); color: var(--cyan); }
.stat.red .ico { background: rgba(47, 107, 255, .16); border-color: rgba(47, 107, 255, .45); color: #7aa5ff; }
.stat .ico svg { width: 26px; height: 26px; }
.stat b { text-shadow: 0 0 12px rgba(56, 200, 255, 0.10); display: block; font: 700 clamp(26px, 4vw, 32px)/1.1 var(--mono); font-variant-numeric: tabular-nums; }
.stat span { font: 500 12px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--cyan); }
.stat.red span { color: var(--dim); }
.coverage-panel { margin-top: 18px; }
.coverage-panel .stats { margin-bottom: 22px; }
.integration-panel .stat { border-color: #a855f744; background: linear-gradient(180deg, #a855f70f, rgba(15,21,32,.9)); box-shadow: 0 0 28px #a855f71a, inset 0 0 16px #a855f708; }
.integration-panel .stat .ico { color: #c084fc; border-color: #a855f744; background: #a855f714; box-shadow: 0 0 14px #a855f71a; }
.integration-panel .stat b { text-shadow: 0 0 12px #a855f729; }
.integration-panel .stat span { color: #c084fc; }
.coverage-panel .legend { font-size: 12px; gap: 14px; }
.coverage-panel .label { margin-top: 18px; }
.overall { display: flex; align-items: center; gap: 16px; margin: 18px 0 24px; font: 500 15px var(--mono); }
.overall .bar { flex: 1; }

.bar { height: 12px; background: #172131; border-radius: 99px; overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; min-width: 0; }
.bar .m { background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 99px; box-shadow: 0 0 8px rgba(56, 200, 255, 0.20); }
.bar.g .m { background: var(--green); }
.bar.b .m { background: #f0883e; }
.bar .p { background: color-mix(in srgb, var(--green) 35%, var(--panel)); }
.bar.code .s { background: var(--blue); }
.bar.code .m { background: var(--green); box-shadow: none; }
.bar.code .s, .bar.code .m, .bar.code .p { border-radius: 0; }
.bar.code .p { background: repeating-linear-gradient(135deg, #216841 0 5px, #193d2a 5px 10px); background-size: 14px 14px; animation: progress-stripes .8s linear infinite; }
@keyframes progress-stripes { to { background-position: 14px 0; } }
@media (prefers-reduced-motion: reduce) { .bar.code .p { animation: none; } }
.bar.native i { border-radius: 0; }
.bar.native .n { background: #a855f7; } .bar.native .e { background: #58a6ff; }
.bar.native .y { background: #d29922; } .bar.native .u { background: #3a3d45; }
.integration-summary { margin-top: 12px; }
.integration-summary .label { color: #c084fc; font-size: 12px; margin: 0 0 6px; }
.integration-summary .bar { height: 8px; }
.view-switch { display: flex; width: fit-content; gap: 4px; padding: 5px; border: 1px solid var(--line2); border-radius: 12px; background: var(--panel2); margin: 20px 0; }
.view-switch button { cursor: pointer; color: var(--dim); border: 0; border-radius: 8px; padding: 10px 20px; background: transparent; font: 600 13px Inter, sans-serif; }
.view-switch button[aria-pressed="true"] { background: #7c3aed; color: white; box-shadow: 0 3px 16px #7c3aed44; }
.chart-toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
.chart-toolbar .view-switch { margin: 0; }
.chart-toolbar strong { color: #d8b4fe; font: 600 20px var(--mono); }
.section-mode { display: flex; width: fit-content; gap: 3px; padding: 4px; margin: -8px 0 18px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); }
.section-mode button { border: 0; border-radius: 6px; padding: 7px 16px; color: var(--dim); background: transparent; font: 500 13px Inter, sans-serif; cursor: pointer; }
.section-mode button:hover { color: var(--text); background: var(--panel2); }
.section-mode button[aria-pressed="true"] { color: white; background: #2463d4; }
.section-mode button[data-mode="integration"][aria-pressed="true"] { background: #7540b7; }
.section-mode button:focus-visible { outline: 2px solid var(--accent2); outline-offset: 2px; }
.function-card .function-status { display:inline-block; color:#d8b4fe; background:#a855f71c; border:1px solid #a855f744; padding:3px 10px; border-radius:99px; margin:8px 0; }
.function-card .function-meta { color:var(--dim); font:12px var(--mono); margin:5px 0 12px; }
.function-card details { margin-top:12px; }
.source-links { display: inline-flex; gap: 12px; flex-wrap: wrap; }
.function-card details code { overflow-wrap:anywhere; white-space:normal; }

/* panels and sections */
.panel { box-shadow: 0 0 28px rgba(47, 107, 255, 0.09), inset 0 0 14px rgba(56, 200, 255, 0.02); border: 1px solid var(--line2); border-radius: 14px; background: rgba(15, 21, 32, .7); padding: 14px; }
.commit { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; background: var(--panel2); border-radius: 10px; padding: 12px 16px; }
.commit .ico { color: var(--accent); width: 32px; height: 32px; flex: none; }
.commit .who b { display: block; font-weight: 600; }
.commit .who small { color: var(--dim); }
.commit .msg { flex: 1; min-width: 220px; display: flex; align-items: center; gap: 12px; border: 1px solid var(--line2);
  border-radius: 8px; padding: 8px 12px; font: 13px var(--mono); color: #c3cdd9; overflow: hidden; }
.commit .msg span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hash { background: rgba(47, 107, 255, .2); color: #8fb3ff; border-radius: 6px; padding: 2px 10px; flex: none; }
.step { background: none; border: 1px solid var(--line2); color: var(--text); border-radius: 8px; width: 34px; height: 34px;
  cursor: pointer; font-size: 16px; }
.step { box-shadow: 0 0 9px rgba(47, 107, 255, 0.10); }
.step:disabled { opacity: .35; cursor: default; box-shadow: none; }

.head { display: flex; align-items: end; justify-content: space-between; gap: 24px; flex-wrap: wrap; margin: 48px 0 18px; }
.head h2 { margin: 0; padding-left: 20px; border-left: 4px solid var(--accent2); text-shadow: 0 0 14px rgba(56, 200, 255, 0.10); font: 700 clamp(26px, 5vw, 34px)/1 var(--head);
  text-transform: uppercase; letter-spacing: .02em; }
.head h2 small { display: block; font: 500 12px var(--mono); letter-spacing: .2em; color: var(--dim); margin-bottom: 6px; }
.head p { margin: 0; max-width: 560px; color: #b7c2d0; font-size: 14px; }
.warn { margin-top: 8px !important; color: #9fd8ff !important; }

/* client cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.card { box-shadow: 0 0 24px rgba(47, 107, 255, 0.09), inset 0 0 12px rgba(56, 200, 255, 0.01); position: relative; border: 1px solid var(--line2); border-radius: 12px; padding: 18px 20px 20px;
  background: linear-gradient(180deg, var(--panel2), var(--panel)); transition: border-color .15s, box-shadow .15s; }
.card:hover { border-color: rgba(56, 200, 255, .7); box-shadow: 0 0 40px rgba(56, 160, 255, 0.17), inset 0 0 18px rgba(56, 200, 255, 0.05); }
.card h3 { margin: 0 0 10px; padding-bottom: 10px; border-bottom: 1px solid var(--line2); font: 700 28px/1.1 var(--head);
  display: flex; justify-content: space-between; align-items: center; }
.card h3 a { color: var(--text); }
.card h3 a::after { content: ""; position: absolute; inset: 0; }  /* whole card opens the client page */
.card h3 .chev { color: var(--dim); font-size: 22px; }
.card .meta { color: var(--dim); font: 12px/1.6 var(--mono); min-height: 3.2em; }
.card .row { display: flex; align-items: center; gap: 12px; margin-top: 10px; font: 12px var(--mono); color: var(--dim); }
.card .row .bar { flex: 1; height: 8px; }
.card .count { font: 13px var(--mono); color: #c3cdd9; margin-top: 4px; }
.join { position: relative; z-index: 1; display: flex; justify-content: center; gap: 8px; margin-top: 16px; padding: 9px 14px;
  border: 1px solid var(--accent); border-radius: 8px; color: #fff; font-weight: 600;
  background: linear-gradient(90deg, rgba(47, 107, 255, .18), rgba(56, 200, 255, .08)); }
.join:hover { background: linear-gradient(90deg, rgba(47, 107, 255, .4), rgba(56, 200, 255, .2)); text-decoration: none; }
.join { box-shadow: 0 0 16px rgba(56, 200, 255, 0.14), inset 0 0 9px rgba(56, 200, 255, 0.06); border-color: var(--accent2) !important;
  text-shadow: 0 0 8px rgba(56, 200, 255, 0.22); }
.join:hover { box-shadow: 0 0 26px rgba(56, 200, 255, 0.22), inset 0 0 12px rgba(56, 200, 255, 0.09); }
.join.solid { display: inline-flex; background: linear-gradient(90deg, var(--accent), var(--accent2)); border: 0; padding: 10px 20px; box-shadow: 0 0 27px rgba(56, 200, 255, 0.20); }
a.join { font: inherit; cursor: pointer; }

/* tables */
.table { box-shadow: 0 0 27px rgba(47, 107, 255, 0.09); overflow-x: auto; border: 1px solid var(--line2); border-radius: 12px; background: rgba(15, 21, 32, .7); }
table { width: 100%; border-collapse: collapse; font: 13px var(--mono); }
td, th { text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
th { color: var(--dim); font: 500 13px Inter, sans-serif; }
#libs tr.lib { cursor: pointer; }
#libs tr.lib:hover td { background: rgba(56, 200, 255, 0.04); }
#libs tr.part td { color: var(--dim); font-size: 12px; padding-top: 7px; padding-bottom: 7px; }
#libs tr.part td:first-child { padding-left: 40px; }
.mapbtn { margin-left: 8px; padding: 2px 9px; font: 500 11px Inter, sans-serif; color: var(--cyan); background: transparent;
  border: 1px solid var(--line2); border-radius: 6px; cursor: pointer; }
.mapbtn:hover { border-color: var(--cyan); }
.mapgroup { margin: 0 0 10px; font: 13px Inter, sans-serif; color: var(--dim); }
.mapgroup b { color: var(--text); }
.caret { display: inline-block; width: 18px; color: var(--dim); }
td.user { font: 600 15px Inter, sans-serif; color: var(--cyan); }
.medal { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; font-weight: 700;
  font-size: 12px; color: #2b1d00; background: #3a4558; color: var(--text); }
.medal.m1 { background: radial-gradient(circle at 35% 30%, #ffe27a, #e0a800); color: #3b2a00; }
.medal.m2 { background: radial-gradient(circle at 35% 30%, #f2f4f7, #9aa5b4); color: #1d2430; }
.medal.m3 { background: radial-gradient(circle at 35% 30%, #f3b37c, #b5652a); color: #2e1606; }

/* client page bits */
.back { font: 14px var(--mono); display: inline-block; margin-top: 28px; }
.sub { font: 14px var(--mono); color: var(--dim); text-align: center; margin: 6px 0 16px; }
.page-title { font: 700 clamp(40px, 9vw, 64px)/1 var(--head); text-align: center; margin: 16px 0 0; }
.center { text-align: center; margin-bottom: 24px; }
.label { font-weight: 600; margin: 20px 0 6px; }
.label small { color: var(--dim); font-weight: 400; }
.controls { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
select, input { background: var(--panel); color: var(--text); border: 1px solid var(--line2); border-radius: 8px; padding: 10px 12px; font: inherit; min-width: 0; }
select { flex: 1 1 200px; }
input { flex: 2 1 240px; }
.map { position: relative; }
canvas { display: block; width: 100%; height: min(70vh, 560px); background: var(--grey); border-radius: 8px; cursor: pointer; }
.tip { position: absolute; pointer-events: none; background: #f2f3f5; color: #111; font: 12px var(--mono); padding: 3px 8px; border-radius: 4px; white-space: nowrap; display: none; }
.detail { border: 1px solid var(--line2); border-radius: 10px; background: var(--panel); padding: 12px 16px; margin-top: 12px; font: 13px var(--mono); overflow-wrap: anywhere; }
.detail a { display: inline-block; margin-top: 8px; font-family: var(--sans); }
.legend { display: flex; gap: 16px; color: var(--dim); font-size: 13px; margin-top: 8px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
.note { color: var(--dim); font: 12px var(--mono); margin-top: 12px; }
.mining-chart { overflow-x: auto; }
.mining-chart svg { display: block; width: 100%; min-width: 560px; }
.mining-stack { outline: none; }
.mining-stack:hover rect, .mining-stack:focus rect { stroke: var(--text); stroke-width: 1.5; }
.mining-chart text { fill: var(--dim); font: 12px var(--mono); }
.mining-days { margin-top: 12px; }
.mining-days summary { cursor: pointer; color: var(--accent2); }
.remaining-card { border: 1px solid var(--line2); border-radius: 14px; background: var(--panel); overflow: hidden; }
.remaining-table { table-layout: fixed; }
.remaining-table th { background: var(--panel2); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
.remaining-table th button { display: flex; gap: 6px; align-items: center; border: 0; padding: 0; background: none; color: inherit; font: inherit; text-transform: inherit; letter-spacing: inherit; cursor: pointer; }
.remaining-table th button::after { content: "↕"; opacity: .45; }
.remaining-table th[aria-sort="ascending"] button::after { content: "↑"; opacity: 1; color: var(--accent2); }
.remaining-table th[aria-sort="descending"] button::after { content: "↓"; opacity: 1; color: var(--accent2); }
.remaining-table th button:hover { color: var(--accent2); }
.remaining-table th:nth-child(1) { width: 116px; }
.remaining-table th:nth-child(2) { width: 94px; }
.remaining-table th:nth-child(3) { width: 116px; }
.remaining-table th:nth-child(5) { width: 158px; }
.remaining-table td { padding-top: 17px; padding-bottom: 17px; white-space: normal; overflow-wrap: anywhere; vertical-align: middle; }
.remaining-table td:first-child { color: var(--accent2); }
.remaining-table td:nth-child(2) { color: var(--dim); font-size: 12px; }
.remaining-table td:nth-child(4) { line-height: 1.6; font-size: 12px; }
.remaining-table tbody tr:hover { background: rgba(88, 166, 255, .035); }
.remaining-table td:last-child a { display: inline-block; font: 500 11px Inter, sans-serif; padding: 6px 9px; border: 1px solid var(--line2); border-radius: 6px; }
.remaining-table td:last-child a:hover { background: var(--panel2); border-color: var(--accent2); }
.remaining-score { display: flex; align-items: center; gap: 9px; font-size: 12px; font-variant-numeric: tabular-nums; }
.remaining-score i { display: block; width: 42px; height: 4px; border-radius: 4px; background: var(--line2); overflow: hidden; flex: none; }
.remaining-score b { display: block; height: 100%; background: #d4ad55; border-radius: inherit; }
.remaining-pagination { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 16px; border-top: 1px solid var(--line2); background: var(--panel2); }
.remaining-pagination span { color: var(--dim); font: 12px Inter, sans-serif; }
.remaining-pagination nav { display: flex; gap: 8px; }
.remaining-pagination button { width: auto; padding: 0 12px; font: 500 12px Inter, sans-serif; }
.remaining-pagination-top { border-top: 0; border-bottom: 1px solid var(--line2); }

/* footer */

/* footer */
footer { border-top: 1px solid var(--line); margin-top: 64px; padding: 28px 0; }
footer .wrap { display: flex; align-items: center; justify-content: space-between; gap: 18px; flex-wrap: wrap; }
footer .actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
footer img { height: 30px; }

@media (max-width: 640px) {
  .top { flex-wrap: wrap; gap: 10px; justify-content: space-between; }
  .top nav { order: 3; flex-basis: 100%; justify-content: center; white-space: normal; }
  .top nav a { padding: 4px 8px; }
  .stat { padding: 16px; }
  .remaining-table thead { display: block; background: var(--panel2); }
  .remaining-table thead tr { display: flex; flex-wrap: wrap; gap: 16px; }
  .remaining-table thead th:nth-child(n) { width: auto; padding: 0; border: 0; }
  .remaining-table thead th:last-child { display: none; }
  .remaining-table, .remaining-table tbody { display: block; }
  .remaining-table tr { display: grid; grid-template-columns: 1fr 1fr 1fr; padding: 16px; gap: 10px; border-bottom: 1px solid var(--line); }
  .remaining-table td { display: block; padding: 0; border: 0; }
  .remaining-table td:nth-child(4), .remaining-table td:nth-child(5) { grid-column: 1 / -1; }
  .remaining-table td:nth-child(2) { text-align: center; }
  .remaining-score { justify-content: end; }
  .remaining-table tr:last-child { border-bottom: 0; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="#"><img src="logo.png" alt="RoConstruct"></a>
    <nav>
      <a href="#" data-nav="home">Home</a>
      <a href="#clients" data-nav="clients">Clients</a>
      <a href="#contributors" data-nav="contributors">Contributors</a>
      <a href="sources.html" data-nav="sources">Sources</a>

<script src="library-coverage.js" defer></script>
<script>
const REPO = "https://github.com/colingsnyder2-ux/RoConstruct";
const FINDINGS = "https://github.com/colingsnyder2-ux/RoConstruct-findings";
const app = document.getElementById("app");
const fmt = n => n.toLocaleString("en-US");
const pct = (a, b) => b ? (100 * a / b).toFixed(2) + "%" : "0.00%";
const mb = n => (n / 1048576).toFixed(2) + " MB";
const hex = n => n.toString(16).padStart(8, "0");
const sourceUrl = (client, address) => `${FINDINGS}/blob/main/src/${encodeURIComponent(client)}/${hex(address)}.cpp`;
let sourceCatalog = {};
const libraryUrl = meta => {
  if (!meta) return "";
  const origin = sourceCatalog[meta[0]];
  if (origin?.functions?.[meta[2]]) return origin.functions[meta[2]];
  return origin?.files?.includes(meta[1]) ? origin.url + (origin.kind === "file" ? meta[1].split("/").map(encodeURIComponent).join("/") : "") : "";
};
const sourceLinks = (client, f, short = false) => {
  const indexed = integrationData?.client === client && integrationData.sources?.[hex(f[0])];
  const links = [];
  if (indexed) links.push(`<a href="${FINDINGS}/blob/main/${indexed.path.split('/').map(encodeURIComponent).join('/')}#L${indexed.line}" target="_blank" rel="noopener">${short ? "Integrated" : "Integrated source"} ↗</a>`);
  if (f[4]) links.push(`<a href="${sourceUrl(client, f[0])}" target="_blank" rel="noopener">${f[2] === 100 ? "Mined" : "Candidate"}${short ? "" : " source"} ↗</a>`);
  else {
    const file = f[2] === 100 && f[5] && sourceCatalog[f[5][0]]?.kind !== "archive" ? libraryUrl(f[5]) : "";
    if (file) links.push(`<a href="${esc(file)}" target="_blank" rel="noopener">${short ? "Matched" : "Matched library source"} ↗</a>`);
  }
  return links.length ? `<span class="source-links">${links.join("")}</span>` : "Source file not published yet";
};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const cache = new Map();
const liveScores = new Map();
const liveFunctions = new Map();
let liveView = null;
let progress, history = [], hIdx = -1, integrationData = null, views = {libraries:"mining", remaining:"mining", daily:"mining"};
const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October",
                "November", "December"];
const ICON = {
  code: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M13.5 5l-3 14"/></svg>',
  file: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 2h8l6 6v12a2 2 0 01-2 2H6a2 2 0 01-2-2V4a2 2 0 012-2zm7 1.5V9h5.5L13 3.5zM8 12v2h8v-2H8zm0 4v2h8v-2H8z"/></svg>',
  chart: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="12" width="3.2" height="8" rx="1"/><rect x="10.4" y="7" width="3.2" height="13" rx="1"/><rect x="16.8" y="3" width="3.2" height="17" rx="1"/></svg>',
  branch: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="6" cy="5" r="2.5"/><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="7" r="2.5"/><path d="M6 7.5v9M18 9.5c0 4-6 3.5-11 7.5"/></svg>',
};
// Title = build year; the full build date goes in the descriptor line.
const title = c => c.built ? c.built.slice(0, 4) : c.name;
const longDate = s => { const [y, m, d] = s.split("-").map(Number); return `${MONTHS[m - 1]} ${d}, ${y}`; };
const builtOn = c => c.built ? `Built ${longDate(c.built)} · ` : "";

// Stats for a client at the selected history snapshot (latest = progress.json).
function statsFor(c) {
  const snap = history[hIdx];
  if (hIdx === history.length - 1 || !snap || !snap.clients[c.name]) return c;
  const old = snap.clients[c.name];
  return {...c, ...old, source_bytes: old.source_bytes || 0,
          mined_bytes: old.mined_bytes ?? (old.matched_bytes || 0),
          partial_bytes: old.partial_bytes || 0};
}

async function refreshLiveProgress(updateView = true, name = decodeURIComponent(location.hash.slice(1))) {
  const selected = progress.clients.find(c => c.name === name && c.started);
  try {
    // Pages snapshots stay same-origin: private mining hosts require browser LAN permission.
    const response = await fetch("progress.json", {cache: "no-store", signal: AbortSignal.timeout(5000)});
    if (!response.ok) return;
    const snapshot = await response.json();
    if (snapshot.updated === progress.updated) return;
    if (selected) {
      const result = await fetch(`data/${encodeURIComponent(name)}.json`, {cache: "no-store", signal: AbortSignal.timeout(5000)});
      if (!result.ok) return;
      const data = await result.json(), row = snapshot.clients.find(c => c.name === name);
      if (!row || data.funcs.length !== row.functions) return;
      liveScores.set(name, Object.fromEntries(data.funcs.map(f => [hex(f[0]), f[2]])));
      liveFunctions.set(name, data.funcs.map(f => [hex(f[0]), f[1], f[2], data.units[f[3]], f[4]]));
    }
    for (const row of snapshot.clients) {
      const current = progress.clients.find(c => c.name === row.name);
      if (current) Object.assign(current, row);
    }
    for (const clientName of cache.keys()) if (clientName !== name || !selected) cache.delete(clientName);
    for (const clientName of liveScores.keys()) if (clientName !== name || !selected) {
      liveScores.delete(clientName);
      liveFunctions.delete(clientName);
    }
    progress.updated = snapshot.updated;
    progress.live_updated = snapshot.updated;
    if (!updateView) return;
    if (liveView?.name === name) liveView.update();
    else if (!selected) overview();
  } catch { /* Publish unavailable: retain the last complete snapshot. */ }
}

function miningDays(c) {
  const snapshots = new Map();
  const calendar = new Intl.DateTimeFormat("en-CA", {timeZone: "America/New_York",
    year: "numeric", month: "2-digit", day: "2-digit"});
  for (const snap of [...history, {date: progress.live_updated || progress.updated, clients: {[c.name]: c}}]) {
    const stats = snap.clients[c.name];
    const stamp = new Date(snap.date.replace(" UTC", "Z").replace(" ", "T"));
    if (!stats?.functions || Number.isNaN(stamp.getTime())) continue;
    const parts = Object.fromEntries(calendar.formatToParts(stamp).map(p => [p.type, p.value]));
    snapshots.set(`${parts.year}-${parts.month}-${parts.day}`, stats);
  }
  const dates = [...snapshots.keys()].sort();
  if (!dates.length) return [];
  const days = [];
  let stats;
  for (let t = Date.parse(dates[0]); t <= Date.parse(dates.at(-1)); t += 86400000) {
    const day = new Date(t).toISOString().slice(0, 10);
    stats = snapshots.get(day) || stats;
    days.push({day, matched: stats.matched, functions: stats.functions,
      source: stats.source_matched, mined: stats.mined_matched, partial: stats.partial,
      percent: Math.min(100, 100 * stats.matched / stats.functions),
      gain: days.length ? stats.matched - days.at(-1).matched : null});
  }
  const recorded = days.map((d, i) => ({d, i})).filter(({d}) => d.source != null && d.mined != null);
  for (let i = 0; i < days.length; i++) {
    const d = days[i];
    if (d.source != null && d.mined != null || !recorded.length) continue;
    const before = recorded.findLast(p => p.i < i) || recorded[0];
    const after = recorded.find(p => p.i > i) || recorded.at(-1);
    const share = p => p.d.matched ? p.d.source / p.d.matched : 0;
    const fraction = before.i === after.i ? 0 : (i - before.i) / (after.i - before.i);
    d.source = Math.round(d.matched * Math.max(0, Math.min(1,
      share(before) + fraction * (share(after) - share(before)))));
    d.mined = d.matched - d.source;
    d.estimated = true;
  }
  return days;
}

function dailyGraph(days, integration = false, switcher = false) {
  if (!days.length) return "";
  const width = Math.max(900, days.length * 28 + 96), step = (width - 96) / days.length;
  const barWidth = Math.min(40, step - Math.min(6, step * 0.15));
  const x = i => 60 + i * step + (step - barWidth) / 2;
  const y = percent => 284 - percent * 2.4;
  const last = days.at(-1);
  const gain = d => d.gain === null ? "—" : `${d.gain > 0 ? "+" : ""}${fmt(d.gain)}`;
  const remaining = d => Math.max(0, d.functions - d.matched - (d.partial || 0) - (integration ? d.waiting : 0));
  const series = integration ? [["integrated", "Integrated", "#a855f7"], ["waiting", "Exact waiting", "#58a6ff"]] : [["source", "Original source", "#58a6ff"],
    ["mined", "Mined", "#3fb950"], ["partial", "Partial", "#b6a04c"]];
  const count = n => n == null ? "—" : fmt(n);
  return `<div class="head"><h2><small>Daily progress</small>${integration ? "Integration" : "Mining"}</h2>
    <p>${fmt(last.matched)} / ${fmt(last.functions)} functions ${integration ? "integrated" : "matched"} · ${last.percent.toFixed(2)}% ${integration ? "of target bytes" : "complete"}.
    One stack per day (US Eastern), toward 100%. Full history since ${days[0].day}.</p></div>
    ${switcher ? sectionMode("daily", "Daily progress view") : ""}
    <div class="panel mining-chart"><svg viewBox="0 0 ${width} 364" style="min-width:${Math.max(560, days.length * 28 + 96)}px" role="img" aria-label="Daily stacked function counts: ${integration ? "integrated, exact waiting and remaining" : "original source, mined, partial and remaining"}, zero to one hundred percent">
      ${[0, 20, 40, 60, 80, 100].map(p => `<line x1="56" x2="${width - 32}" y1="${y(p)}" y2="${y(p)}" stroke="var(--line2)"/>
        <text x="46" y="${y(p) + 4}" text-anchor="end">${p}%</text>`).join("")}
      ${days.map((d, i) => {
        const split = integration || d.source != null && d.mined != null;
        const segments = split ? series : [["matched", "Matched (source/mined split unavailable)", "#8a97a8"], series[2]];
        let bottom = 0;
        return `<g class="mining-stack" tabindex="0" role="img" aria-label="${d.day}: ${d.percent.toFixed(2)}% ${integration ? "of target bytes integrated" : "matched"}">
          <title>${d.day}: ${fmt(d.matched)} ${integration ? "integrated" : "matched"} total / ${fmt(d.functions)} (${d.percent.toFixed(2)}%); daily change ${gain(d)}. ${integration ? `Exact waiting: ${count(d.waiting)};` : `Original source: ${count(d.source)}; mined: ${count(d.mined)}${d.estimated ? " (source/mined split estimated)" : ""}; partial: ${count(d.partial)};`} remaining: ${fmt(remaining(d))}</title>
          <rect x="${x(i)}" y="${y(100)}" width="${barWidth}" height="240" rx="3" fill="var(--panel2)"/>
          ${segments.map(([key, label, color]) => {
            const value = d[key] || 0, fraction = integration ? 100 * (d.byteGroups[key] || 0) / (d.bytes || 1) : 100 * value / d.functions, height = Math.min(100 - bottom, fraction);
            bottom += height;
            return `<rect data-series="${key}" x="${x(i)}" y="${y(bottom)}" width="${barWidth}" height="${height * 2.4}" fill="${color}"><title>${d.day}: ${fmt(value)} ${label.toLowerCase()} / ${fmt(d.functions)} (${fraction.toFixed(2)}%${integration ? " of target bytes" : ""})${d.estimated && key !== "partial" ? " (estimated)" : ""}</title></rect>`;
          }).join("")}</g>`;
      }).join("")}
      ${days.map((d, i) => `<text x="${x(i) + barWidth / 2}" y="306" transform="rotate(-40 ${x(i) + barWidth / 2} 306)" text-anchor="end">${d.day.slice(5).replace("-", "/")}${d.estimated ? "*" : ""}</text>`).join("")}
      <text x="${width - 32}" y="354" text-anchor="end">${days[0].day.slice(0, 4)} · US Eastern</text>
    </svg><div class="legend">${series.map(([key, label, color]) => `<span><i style="background:${color}"></i>${label} · ${count(last[key])}</span>`).join("")}<span><i style="background:var(--panel2);border:1px solid var(--line2)"></i>Remaining · ${fmt(remaining(last))}</span></div></div>
    ${days.some(d => d.estimated) ? '<p class="note">* Source/mined split estimated from nearby days. Recorded matched and partial totals unchanged.</p>' : ""}
    <details class="mining-days"><summary>Daily function counts</summary><p class="note">${integration ? "Recorded native snapshots only; earlier unrecorded totals are not reconstructed." : "Last snapshot each day; days without snapshots carry the previous total. Historical source/mined counts recovered from archived function data; * marks estimated splits, unavailable counts show —."} Changes include inventory corrections. First recorded total has no daily change.</p>
      <div class="table"><table><thead><tr><th>Day (US Eastern)</th>${integration ? "<th>Integrated</th><th>Exact waiting</th><th>Remaining</th>" : "<th>Matched</th><th>Source</th><th>Mined</th><th>Partial</th>"}<th>Daily change</th><th>${integration ? "Target bytes" : "Complete"}</th></tr></thead><tbody>
      ${days.map(d => `<tr><td>${d.day}${d.estimated ? "*" : ""}</td><td>${fmt(d.matched)}</td>${integration ? `<td>${count(d.waiting)}</td><td>${fmt(remaining(d))}</td>` : `<td>${count(d.source)}</td><td>${count(d.mined)}</td><td>${count(d.partial)}</td>`}<td>${gain(d)}</td><td>${d.percent.toFixed(2)}%</td></tr>`).join("")}
      </tbody></table></div></details>`;
}

function miningGraph(c, switcher = false) {
  return dailyGraph(miningDays(c), false, switcher);
}

function bar(m, p, total, cls = "") {
  const w = 100 * m / total || 0;  // nonzero progress stays visible even at 0.4%
  return `<div class="bar ${cls}"><i class="m" style="width:${w ? `max(10px, ${w}%)` : 0}"></i>` +
         `<i class="p" style="width:${100 * p / total || 0}%"></i></div>`;
}

function codeBar(source, mined, partial, total) {
  const width = n => total ? 100 * n / total : 0;
  return `<div class="bar code"><i class="s" style="width:${width(source)}%"></i>` +
         `<i class="m" style="width:${width(mined)}%"></i><i class="p" style="width:${width(partial)}%"></i></div>`;
}

/* Native integration: mined functions placed into the real rebuilt source tree, reproduced byte-exact by the
   linked rebuild (docs/integration.json, published hourly). Same groups as the Discord integration digest. */
function integrationBar(i, name) {
  if (!i || i.client !== name) return "";
  const g = i.groups, total = Object.values(g).reduce((a, x) => a + x.bytes, 0) || 1;
  const w = n => (100 * n / total).toFixed(3) + "%";
  return `
    <div class="label">Integrated code <small>(${mb(g.integrated.bytes)} of ${mb(total)}) — ${pct(g.integrated.bytes, total)}</small></div>
    <div class="bar native" role="progressbar" aria-label="Integrated code bytes" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${(100 * g.integrated.bytes / total).toFixed(2)}"><i class="n" style="width:${w(g.integrated.bytes)}"></i><i class="e" style="width:${w(g.exact_waiting.bytes)}"></i>
      <i class="u" style="width:${w(g.partial.bytes + g.unmined.bytes)}"></i></div>
    <div class="legend"><span><i style="background:#a855f7"></i>Integrated</span>
      <span><i style="background:#58a6ff"></i>Exact waiting</span>
      <span><i style="background:#3a3d45"></i>Not exact</span></div>
`;
}

function integrationSection(i, name) {
  if (!i || i.client !== name) return "";
  const g = i.groups;
  const funcs = Object.values(g).reduce((a, x) => a + x.functions, 0);
  return `
    <div class="stats">
      <div class="stat"><div class="ico">${ICON.code}</div><div><b>${fmt(g.integrated.functions)}</b><span>Integrated</span></div></div>
      <div class="stat"><div class="ico">${ICON.chart}</div><div><b>${fmt(g.exact_waiting.functions)}</b><span>Exact waiting</span></div></div>
      <div class="stat red"><div class="ico">${ICON.file}</div><div><b>${fmt(funcs - g.integrated.functions)}</b><span>Not integrated</span></div></div>
    </div>`;
}

function integrationSummary(i, name, compact = false) {
  if (!i || i.client !== name) return "";
  const total = Object.values(i.groups).reduce((sum, g) => sum + g.bytes, 0);
  const percent = total ? 100 * i.groups.integrated.bytes / total : 0;
  const waiting = total ? 100 * (i.groups.exact_waiting?.bytes || 0) / total : 0;
  return `<div class="integration-summary">${compact ? "" : `<div class="label">Integrated · ${percent.toFixed(2)}%</div>`}
    <div class="bar native" role="progressbar" aria-label="Integrated code bytes" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${percent.toFixed(2)}"><i class="n" style="width:${percent}%"></i><i class="e" style="width:${waiting}%"></i></div></div>`;
}

function integrationDays(i) {
  const recorded = new Map();
  if (i.daily) for (const row of i.daily) recorded.set(row.day, {...row});
  else {
    const calendar = new Intl.DateTimeFormat("en-CA", {timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit"});
    for (const job of i.jobs || []) {
      const stamp = new Date(job.when.replace(" UTC", "Z").replace(" ", "T"));
      const parts = Object.fromEntries(calendar.formatToParts(stamp).map(p => [p.type, p.value]));
      const day = `${parts.year}-${parts.month}-${parts.day}`;
      if (!recorded.has(day)) recorded.set(day, {day, gains: 0, jobs: 0, models: {}});
      const row = recorded.get(day);
      row.gains += job.distinct_gains ?? job.gains;
      row.jobs++;
      const model = job.model || "Unknown";
      const series = row.models[model] ||= {gains: 0, jobs: 0};
      series.gains += job.distinct_gains ?? job.gains;
      series.jobs++;
    }
  }
  const dates = [...recorded.keys()].sort();
  if (!dates.length) return [];
  const end = new Date(i.updated.replace(" UTC", "Z").replace(" ", "T"));
  const calendar = new Intl.DateTimeFormat("en-CA", {timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit"});
  const parts = Object.fromEntries(calendar.formatToParts(end).map(p => [p.type, p.value]));
  const days = [];
  for (let t = Date.parse(dates[0]); t <= Date.parse(`${parts.year}-${parts.month}-${parts.day}`); t += 86400000) {
    const day = new Date(t).toISOString().slice(0, 10);
    days.push(recorded.get(day) || {day, gains: 0, jobs: 0});
  }
  return days;
}

function integrationDaily(i, switcher = false) {
  const snapshots = i.history?.length ? i.history : [{day:i.updated.slice(0,10),groups:i.groups}];
  const days = snapshots.slice().sort((a,b) => a.day.localeCompare(b.day)).map((row,index,rows) => {
    const functions = Object.values(row.groups).reduce((sum,g) => sum + g.functions, 0);
    const integrated = row.groups.integrated.functions, waiting = row.groups.exact_waiting.functions;
    const bytes = Object.values(row.groups).reduce((sum,g) => sum + g.bytes, 0);
    return {day:row.day,functions,integrated,waiting,matched:integrated,bytes,
      byteGroups:{integrated:row.groups.integrated.bytes,waiting:row.groups.exact_waiting.bytes},
      percent:bytes ? 100 * row.groups.integrated.bytes / bytes : 0,
      gain:index ? integrated - rows[index-1].groups.integrated.functions : null};
  });
  return dailyGraph(days, true, switcher);
}

// Squarified treemap: lays items ({v}) into rect, writes x,y,w,h onto each.
function squarify(items, x, y, w, h) {
  const total = items.reduce((a, it) => a + it.v, 0);
  if (!total) return;
  const scale = w * h / total;
  let i = 0;
  while (i < items.length) {
    const side = Math.min(w, h);
    let sum = 0, min = Infinity, max = 0, worst = Infinity, j = i;
    while (j < items.length) {
      const a = items[j].v * scale;
      const s = sum + a, mn = Math.min(min, a), mx = Math.max(max, a);
      const wst = Math.max(side * side * mx / (s * s), s * s / (side * side * mn));
      if (j > i && wst > worst) break;
      sum = s; min = mn; max = mx; worst = wst; j++;
    }
    const thick = sum / side;
    let off = 0;
    for (let k = i; k < j; k++) {
      const len = items[k].v * scale / thick;
      if (w >= h) Object.assign(items[k], {x: x, y: y + off, w: thick, h: len});
      else Object.assign(items[k], {x: x + off, y: y, w: len, h: thick});
      off += len;
    }
    if (w >= h) { x += thick; w -= thick; } else { y += thick; h -= thick; }
    i = j;
  }
}

// Filter tokens: <70% >1kb <200b, anything else matches address or unit name.
function parseFilter(text, units) {
  const tests = [];
  for (const tok of text.toLowerCase().split(/\s+/).filter(Boolean)) {
    const m = tok.match(/^([<>])(\d+(?:\.\d+)?)(%|kb|b)$/);
    if (!m) {
      const t = tok.replace(/^0x/, "");
      tests.push(f => hex(f[0]).includes(t) || units[f[3]].toLowerCase().includes(tok));
      continue;
    }
    const n = parseFloat(m[2]) * (m[3] === "kb" ? 1024 : 1);
    const val = m[3] === "%" ? f => f[2] : f => f[1];
    tests.push(m[1] === "<" ? f => val(f) < n : f => val(f) > n);
  }
  return f => tests.every(t => t(f));
}

// Library of a unit label (RTTI class nearest the function). First rule wins;
// labels are approximate, so this is an estimate of where code came from.
const MFC = /^(?:[A-Z0-9_$]*V)?C(?:Wnd|FrameWnd|MDIFrameWnd|MDIChildWnd|Edit|Static|ListBox|ComboBox|Button|Brush|Pen|Rgn|Rect|Point|Size|PtrList|PtrArray|ObList|StringList|StringArray|Ole\w*|CmdUI|EnabledCmdUI|Dialog|View|Document|WinApp|WinThread|Object|Archive|File|Exception|DC|ClientDC|PaintDC|WindowDC|GdiObject|Bitmap|Font|Menu|ImageList|ToolBar|StatusBar|ControlBar|SplitterWnd|ScrollView|FormView|EditView|HtmlView|HtmlEditView|DHtmlDialog|PropertySheet|PropertyPage|TreeCtrl|ListCtrl|TabCtrl|SpinButtonCtrl|ProgressCtrl|SliderCtrl|DockState|DockBar|DocTemplate|SingleDocTemplate|MultiDocTemplate|DocManager|MemFile|String|Map\w+|Array|CommandLineInfo|RecentFileList|Mini\w*Wnd)$/;
const ENGINE = "Roblox engine", APP = "Roblox app (non-RBX classes)", UNLABELED = "Unlabeled (no RTTI nearby)";
// Template instantiations go to the library that owns the template, not its argument.
const LIBRARIES = [
  ["XTP (Codejock)", u => /CXTP|XTP[A-Z_]|(^|V)CXT[A-Z]/.test(u)],
  ["G3D", u => /G3D/.test(u)],
  ["Ogre", u => /Ogre/.test(u)],
  ["boost", u => /boost|\?\$(sp_counted_impl|stream_buffer)/.test(u)],
  ["ATL", u => /^ATL(::|$)|\?\$(CCom\w*Object\w*|CComEnum|CProxy_|IObjectSafety)/.test(u)],
  ["MFC", u => /\?\$C(Map|Array|List|TypedPtr)/.test(u)],
  ["RakNet", u => /RakPeer|RakNet|PacketReliab/.test(u)],
  ["Scintilla", u => /Scintilla/.test(u)],
  ["Lua", u => /(^|[^A-Za-z])lua_|^lua/.test(u)],
  ["STL (std)", u => /^std(::|$)/.test(u)],
  ["MFC", u => MFC.test(u.split(/::|<|\?\$/)[0])],
  ["SHA-1 (CSHA1)", u => /^CSHA1$/.test(u)],
  [ENGINE, u => /RBX|rbx/.test(u)],
  [UNLABELED, u => !u || /^seg_/.test(u)],
];
const libraryOf = u => (LIBRARIES.find(([, test]) => test(u)) || [APP])[0];

// Library of the recipe whose source rebuilt a function: exact, so it beats the unit label.
// Generic template recipes say nothing about the owner and fall through.
const RECIPES = [
  [/^xtp-/, "XTP (Codejock)"], [/^mfc-/, "MFC"], [/^atl-/, "ATL"], [/g3d/, "G3D"],
  [/jpeg/, "libjpeg"], [/^libpng-/, "libpng"], [/^zlib-/, "zlib"], [/^wildmagic-/, "Wild Magic"],
  [/^ogre-/, "Ogre"], [/^boost-/, "boost"], [/^lua-/, "Lua"], [/raknet/, "RakNet"],
  [/^scintilla-/, "Scintilla"], [/^(rbxgs|openrbx-client|rbx2016|rccservice)/, ENGINE],
];
const recipeOf = src => src && (RECIPES.find(([re]) => re.test(src[0])) || [])[1];

// Roblox subsystem: [name, source path test, unit label test]. First match wins.
const PARTS = [
  ["Signals & events", /signal/i, /rbx::signals|\?\$signal|EventData/],
  ["Networking", /net|raknet|Network|http/i, /RBX::Network|Replicat|Marshal|Packet|Http/],
  ["Task scheduler & jobs", /task/i, /RBX::Tasks|Arbiter|Job|Heartbeat|Barrier|Throttl|RunTransition/],
  ["Lua scripting", /script/i, /RBX::Lua|Script|LDraw2Lua|LuaFunction/],
  ["Humanoid & animation", /humanoid|anim/i, /HUMAN|Humanoid|Animat|Keyframe/],
  ["Sound", /sound/i, /Sound/],
  ["Rendering", /view|render|appdraw/i, /RBX::(View|Render|Adorn)|RenderSettings|RenderSurface|Material|Gfx|Texture|Mesh|Chunk|Scene|Builder|Lighting|Sky|Decal|SurfaceDescriptor|FloorWire/],
  ["Physics", /v8world|v8kernel/, /Contact|Stage|Joint|Clump|Primitive|Link|Body(Mover|Velocity|Position|Thrust|AngularVelocity|Gyro|Force)?$|Connector|SimJob|FilterStairs|Seat|Kernel|Physics|Assembly|Glue|Weld|Motor|RBX::(Ball|Block)$|Poly$|Pair$|Spatial|Geometry|Platform|RadialNormal|Point$|Hole$|Occlusion|World$/],
  ["XML serialization", /xml/i, /Xml|Serializ|Archive|Binder$/],
  ["Reflection & bindings", /reflection/, /Reflection|Desc(riptor)?\b|PropGetSet|GetSetImpl|FactoryProduct|Exposer|SlotWrapper|DescribedNonCreatable/],
  ["Studio UI (MFC/COM windows, docs, dialogs)", /$^/, /^V?C[A-Z]|DHTML|HtmlView|Dialog/],
  ["Tools, verbs & GUI", /tool|gui/, /Tool|Gui|Widget|Button|Hud|Command|Verb|Selection|Drag|Insert|Chat|Item(::|$)|Panel|Menu|Display|Mouse|Controller|Text(Label|Box|Button)|Frame$|Image|Handles|HUD|Scale9|Video|Virtual(User|Hardware)|Plugin|ViewMode|WinGame/],
  ["DataModel & instances", /v8datamodel|v8tree/, /Instance|Service|DataModel|Workspace|Part|Model|Camera|Backpack|Starterpack|Flag|Hat|Accoutrement|Message|Hint|Value|Spawn|Team|HopperBin|Rocket|Explosion|ForceField|Sparkles|Effect|SpecialShape|Skin|BodyColors|Shirt|Feature|ClickDetector|Clothing|BrickColor|AuthoringSettings|RootNode/],
  ["Utilities & logging", /util/, /Log|StandardOut|Hash|MD5|Thread|worker|Debug|Stats|Profil|Input|Crash|Content|stream|Async|JSON|Exception/i],
];
// Roblox code: symbol name, then unit label, then source path (the file that instantiated it,
// which for inline/template code says little). Libraries: the recipe version that rebuilt it.
function partOf(lib, src, unit, sym) {
  if (lib === ENGINE || lib === APP) {
    const part = (sym && PARTS.find(([, , name]) => name.test(sym))) || PARTS.find(([, , name]) => name.test(unit))
      || (src && PARTS.find(([, path]) => path.test(src[0] + "/" + src[1])));
    return part ? part[0] : "Other";
  }
  return src ? src[0].replace(/-(dll|lib|shared|internals|string|strlen|rtm|vc8|mfc)\b.*$/, "") + " source"
    : "not yet matched (by class name)";
}

// Qualified name of an MSVC mangled symbol: ?f@C@NS@@... -> NS::C::f.
const demangle = sym => sym && sym[0] === "?" ? sym.slice(1).split("@@")[0].split("@").reverse().join("::") : "";

// [library, subsystem, exact] per function. A rebuilt function's symbol namespace wins
// (Roblox recipes also compile G3D/std/boost code), then its recipe, then the unit label.
// Only exact rebuilds claim a library: a partial's source is just the nearest candidate.
// Tiny bodies and template instantiations (empty destructors, getters, std::copy) compile
// to identical bytes from any source, so they claim only when the unit label agrees.
// Code with no RTTI class nearby takes the library of its source-matched neighbours when
// both sides agree (static libs link contiguously).
function classify(data) {
  const out = data.funcs.map(f => {
    const unit = data.units[f[3]], sym = demangle(f[5] && f[5][2]), named = sym && libraryOf(sym);
    const source = (named !== APP && named !== UNLABELED && named) || recipeOf(f[5]);
    const generic = f[1] < 64 || /^\?\?\$/.test(f[5] && f[5][2] || ""), label = libraryOf(unit);
    const exact = f[2] === 100 && source && (!generic || label === source) && source;
    const lib = exact || label;
    return [lib, partOf(lib, exact && f[5], unit, sym), !!exact];
  });
  const order = data.funcs.map((f, i) => i).sort((a, b) => data.funcs[a][0] - data.funcs[b][0]);
  // Landmarks (byte signatures found in the exe) claim the whole unlabeled run around them.
  for (const [va, lib] of data.landmarks || []) {
    const at = order.findIndex(i => data.funcs[i][0] <= va && va < data.funcs[i][0] + data.funcs[i][1]);
    if (at < 0 || out[order[at]][0] !== UNLABELED) continue;
    let lo = at, hi = at;
    while (lo > 0 && out[order[lo - 1]][0] === UNLABELED) lo--;
    while (hi < order.length - 1 && out[order[hi + 1]][0] === UNLABELED) hi++;
    for (let k = lo; k <= hi; k++) out[order[k]] = [lib, "found by byte signature", true];
  }
  const near = (k, step) => {
    for (k += step; k >= 0 && k < order.length; k += step) if (out[order[k]][2]) return out[order[k]][0];
  };
  order.forEach((i, k) => {
    if (out[i][0] !== UNLABELED) return;
    const before = near(k, -1), after = near(k, 1);
    out[i] = before && before === after ? [before, "inferred from matched neighbours", false]
      : [UNLABELED, "between " + [before, after].filter(Boolean).join(" and "), false];
  });
  return out;
}

function libraryTable(data, integration = false, switcher = false) {
  const integrated = new Set(integrationData?.native || []);
  const blank = () => ({n: 0, m: 0, b: 0, mb: 0, sb: 0, pb: 0, parts: new Map(), fs: new Set()});
  const add = (r, f) => {
    r.n++; r.b += f[1];
    if (integration) { if (integrated.has(hex(f[0]))) {r.m++;r.mb+=f[1];} else if(f[2]===100) r.pb+=f[1]; }
    else if (f[2] === 100) { r.m++; r.mb += f[1]; if (f[5]) r.sb += f[1]; } else if (f[2] > 0) r.pb += f[1];
  };
  const rows = new Map(), kinds = classify(data);
  data.funcs.forEach((f, i) => {
    const [lib, part] = kinds[i];
    if (!rows.has(lib)) rows.set(lib, blank());
    const r = rows.get(lib);
    if (!r.parts.has(part)) r.parts.set(part, blank());
    add(r, f); add(r.parts.get(part), f);
    r.parts.get(part).fs.add(f);
  });
  data.groups = new Map();  // "lib.part" -> [title, Set of funcs], for the map button
  const bySize = m => [...m].sort((a, b) => b[1].b - a[1].b);
  const cells = r => `<td>${fmt(r.m)} / ${fmt(r.n)}</td><td>${pct(r.m, r.n)}</td>
      <td>${pct(r.mb, r.b)} <small>of ${mb(r.b)}</small></td><td>${integration ? integrationCoverageBar({bytes:r.b,integratedBytes:r.mb,waitingBytes:r.pb}) : codeBar(r.sb, r.mb-r.sb,r.pb,r.b)}</td>`;
  return `<div class="head"><h2><small>Breakdown</small>Libraries</h2><p>Code rebuilt from source is labelled by that source; the rest by unit label (nearest RTTI class) or matched neighbours, so membership is approximate. Click a library to break it down; <b>Map</b> shows a subsection's functions on the unit map.</p></div>
    ${switcher ? sectionMode("libraries", "Library coverage view") : ""}
    <div class="table"><table id="libs"><thead><tr><th>Library</th><th>Functions</th><th>${integration ? "Integrated" : "Matched"}</th><th>Code</th><th style="width:30%">Bytes ${integration ? "integrated" : "matched"}</th></tr></thead><tbody>
    ${bySize(rows).map(([lib, r], i) => `<tr class="lib" data-lib="${i}"><td><span class="caret">▸</span>${esc(lib)}</td>${cells(r)}</tr>` +
      bySize(r.parts).map(([part, p], j) => (data.groups.set(`${i}.${j}`, [`${lib} › ${part}`, p.fs]),
        `<tr class="part" data-of="${i}" hidden><td>${esc(part)} <button class="mapbtn" data-g="${i}.${j}">Map</button></td>${cells(p)}</tr>`)).join("")).join("")}
    </tbody></table></div>
    <div class="legend">${integration ? `<span><i style="background:#a855f7"></i>integrated</span><span><i style="background:#58a6ff"></i>exact, waiting</span><span><i style="background:#263244"></i>not exact</span>` : `<span><i style="background:#58a6ff"></i>original source</span><span><i style="background:#3fb950"></i>mined</span><span><i style="background:repeating-linear-gradient(135deg,#216841 0 5px,#193d2a 5px 10px)"></i>partial source</span>`}</div>`;
}

function wireLibraries(onMap) {
  for (const tr of document.querySelectorAll("#libs tr.lib")) tr.onclick = () => {
    const open = tr.classList.toggle("open");
    tr.querySelector(".caret").textContent = open ? "▾" : "▸";
    for (const sub of document.querySelectorAll(`#libs tr[data-of="${tr.dataset.lib}"]`)) sub.hidden = !open;
  };
  for (const b of document.querySelectorAll("#libs .mapbtn")) b.onclick = () => onMap(b.dataset.g);
}

async function client(name) {
  await refreshLiveProgress(false, name);
  const latest = progress.clients.find(c => c.name === name);
  if (!latest) return overview();
  if (!latest.started) {
    app.innerHTML = `<a class="back" href="#">← all clients</a><h1 class="page-title">${esc(title(latest))}</h1>
      <p class="sub">${esc(builtOn(latest))}${esc(latest.compiler)} — not started. Run <code>roc analyze ${esc(name)}</code>.</p>`;
    return;
  }
  const c = statsFor(latest);
  const native = integrationData && integrationData.client === name ? integrationData : null;
  const nativeSet = new Set(native ? native.native : []);
  let mapMode = "mining";
  if (!cache.has(name)) cache.set(name, await (await fetch(`data/${encodeURIComponent(name)}.json`, {cache: "no-cache"})).json());
  const data = cache.get(name), units = data.units;
  const applyScores = () => {
    const functions = liveFunctions.get(name), previous = new Map(data.funcs.map(f => [hex(f[0]), f]));
    const changed = functions && (functions.length !== data.funcs.length || functions.some(([addr, size, , unit]) =>
      !previous.has(addr) || previous.get(addr)[1] !== size || units[previous.get(addr)[3]] !== unit));
    if (changed) data.funcs = functions.map(([addr, size, score, unit, source]) => {
      let index = units.indexOf(unit);
      if (index < 0) { index = units.length; units.push(unit); }
      const old = previous.get(addr);
      return [parseInt(addr, 16), size, score, index, !!(source || old?.[4]), old?.[5], old?.[6]];
    });
    const scores = liveScores.get(name);
    if (scores) for (const f of data.funcs) f[2] = scores[hex(f[0])] ?? 0;
    if (scores && data.funcs.length === latest.functions) {
      const totals = {source_matched: 0, mined_matched: 0, source_bytes: 0, mined_bytes: 0};
      for (const f of data.funcs) if (f[2] === 100) {
        totals[f[5] ? "source_matched" : "mined_matched"]++;
        totals[f[5] ? "source_bytes" : "mined_bytes"] += f[1];
      }
      Object.assign(latest, totals);
    }
    return changed;
  };
  applyScores();
  const byUnit = new Map();
  for (const f of data.funcs) {
    if (!byUnit.has(f[3])) byUnit.set(f[3], []);
    byUnit.get(f[3]).push(f);
  }
  const unitSize = u => byUnit.get(u).reduce((a, f) => a + f[1], 0);
  const unitOrder = [...byUnit.keys()].sort((a, b) => unitSize(b) - unitSize(a));
  app.innerHTML = `
    <a class="back" href="#">← all clients</a>
    <h1 class="page-title">${esc(title(latest))}</h1>
    <p class="sub">${esc(builtOn(latest))}${esc(latest.compiler)} · ${fmt(latest.classes || 0)} classes · ${fmt(latest.generated || 0)} compiler stubs skipped</p>
    <div class="center">${joinLink(name)}</div>
    ${native ? `<section class="coverage-panel integration-panel" id="live-integration" aria-label="Integration coverage">${integrationSection(native,name)}${integrationBar(native,name)}</section>` : ""}
    <section class="coverage-panel" aria-label="Mining coverage">
    <div class="stats">
      <div class="stat"><div class="ico">${ICON.code}</div><div><b id="live-matched">${fmt(c.matched)}</b><span>Matched</span></div></div>
      <div class="stat"><div class="ico">${ICON.chart}</div><div><b id="live-partial">${fmt(c.partial)}</b><span>Partial</span></div></div>
      <div class="stat red"><div class="ico">${ICON.file}</div><div><b id="live-remaining">${fmt(c.functions - c.matched)}</b><span>Remaining</span></div></div>
    </div>
    <div><div id="live-code"><div class="label">Code <small>(${mb(c.bytes)}) — ${pct(c.matched_bytes, c.bytes)}</small></div>
    ${codeBar(c.source_bytes || 0, c.mined_bytes ?? c.matched_bytes, c.partial_bytes || 0, c.bytes)}</div>
    <div class="legend" id="code-legend"><span><i style="background:#58a6ff"></i>original source</span><span><i style="background:#3fb950"></i>mined</span><span><i style="background:repeating-linear-gradient(135deg,#216841 0 5px,#193d2a 5px 10px)"></i>partial source</span></div>
    </div>
    <div class="label">Data <small>(${mb(latest.data_bytes || 0)}) — ${pct(latest.data_matched_bytes || 0, latest.data_bytes)}
      verified (strings and constants used by matched functions)</small></div>
    ${bar(latest.data_matched_bytes || 0, 0, latest.data_bytes || 1, "b")}
    </section>
    <p class="note" id="live-status">${progress.live_updated ? `Published snapshot · ${esc(progress.live_updated)} · checks every 30s` : `Published snapshot · ${esc(progress.updated)}`}</p>
    <div style="margin-top:20px">${commitPanel()}</div>
    <div id="library-content">${libraryTable(data, native && views.libraries==="integration", !!native)}</div>
    <div class="head"><h2><small>Map</small>Units</h2><p>${fmt(units.length)} units (classes from RTTI). The map always shows the latest state.</p></div>
    <div id="mapgroup" class="mapgroup" hidden></div>
    <div class="controls">
      ${native ? `<select id="mapmode" aria-label="Map mode"><option value="mining">Mining</option><option value="native">Integration</option></select>` : ""}
      <select id="unit" aria-label="Unit"><option value="">All</option>${unitOrder.map(u =>
        `<option value="${u}">${esc(units[u])}</option>`).join("")}</select>
      <input id="filter" placeholder="Filter, e.g.: 'Instance <70% >1kb'">
    </div>
    <div class="map"><canvas id="cv"></canvas><div class="tip" id="tip"></div></div>
    <div class="legend" id="maplegend">${MINING_LEGEND}</div>
    <div class="detail" id="detail">Click a tile to see its function address, match score, and recovered source.</div>
    <div id="live-mining">${native && views.daily==="integration" ? integrationDaily(native, true) : miningGraph({...latest,
      source_matched: latest.source_matched ?? data.funcs.filter(f => f[2] === 100 && f[5]).length,
      mined_matched: latest.mined_matched ?? data.funcs.filter(f => f[2] === 100 && !f[5]).length}, !!native)}</div>
    ${leaderboard(latest.leaderboard, "", name)}
    <div class="head"><h2 id="remaining-title">${native && views.remaining==="integration" ? "Functions not integrated" : "Functions Remaining"}</h2><p>Click a column to sort · 25 per page.</p></div>
    ${native ? sectionMode("remaining", "Remaining functions view") : ""}<div class="remaining-card">
    <div class="remaining-pagination remaining-pagination-top">
      <span id="remaining-top-page" role="status"></span>
      <nav aria-label="Functions remaining top pagination">
        <button class="step" id="remaining-top-prev" aria-label="Previous page">← Previous</button>
        <button class="step" id="remaining-top-next" aria-label="Next page">Next →</button>
      </nav>
    </div>
    <table class="remaining-table"><thead><tr>${["Address", "Size", "Match", "Function / unit"].map((label, i) => `<th aria-sort="${i === 1 ? "descending" : "none"}"><button data-remaining-sort="${i}">${label}</button></th>`).join("")}<th>Source</th></tr></thead>
      <tbody id="remaining"></tbody></table>
    <div class="remaining-pagination">
      <span id="remaining-page" role="status"></span>
      <nav aria-label="Functions remaining pagination">
        <button class="step" id="remaining-prev" aria-label="Previous page">← Previous</button>
        <button class="step" id="remaining-next" aria-label="Next page">Next →</button>
      </nav>
    </div></div>
    <p class="note">Last updated: ${esc(progress.updated)}</p>`;
  wireNav();
  const onLibraryMap = key => {
    const [title, fs] = data.groups.get(key);
    group = fs; unitSel.value = "";
    groupBox.hidden = false;
    groupBox.innerHTML = `Showing <b>${esc(title)}</b>: ${fmt(fs.size)} functions, biggest first <button class="mapbtn">Show all</button>`;
    groupBox.querySelector("button").onclick = () => { group = null; groupBox.hidden = true; layout(); };
    layout();
    cv.scrollIntoView({behavior: "smooth", block: "center"});
  };
  wireLibraries(onLibraryMap);

  const cv = document.getElementById("cv"), tip = document.getElementById("tip");
  const unitSel = document.getElementById("unit"), filter = document.getElementById("filter");
  const groupBox = document.getElementById("mapgroup");
  let boxes = [], frames = [], keep = () => true, group = null;  // group: Set of funcs from a library Map button
  const inGroup = u => group ? byUnit.get(u).filter(f => group.has(f)) : byUnit.get(u);

  function layout() {
    const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1;
    cv.width = r.width * dpr; cv.height = r.height * dpr;
    const pick = (unitSel.value ? [+unitSel.value] : unitOrder).filter(u => inGroup(u).length);
    frames = pick.map(u => ({u, v: inGroup(u).reduce((a, f) => a + f[1], 0)})).sort((a, b) => b.v - a.v);
    squarify(frames, 0, 0, r.width, r.height);
    boxes = [];
    for (const fr of frames) {
      const items = inGroup(fr.u).map(f => ({f, v: f[1]})).sort((a, b) => b.v - a.v);
      squarify(items, fr.x + 1, fr.y + 1, Math.max(fr.w - 2, 0), Math.max(fr.h - 2, 0));
      boxes.push(...items);
    }
    draw();
  }

  function draw() {
    const g = cv.getContext("2d"), dpr = devicePixelRatio || 1;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.fillStyle = "#1d1f24"; g.fillRect(0, 0, cv.width, cv.height);
    for (const b of boxes) {
      g.globalAlpha = keep(b.f) ? 1 : 0.2;
      g.fillStyle = mapMode === "native" ? nativeColor(b.f) : color(b.f[2], b.f[5], b.f[4]);
      g.fillRect(b.x, b.y, b.w, b.h);
      if (b.w > 4 && b.h > 4) { g.strokeStyle = "#2a2c33"; g.lineWidth = 0.5; g.strokeRect(b.x, b.y, b.w, b.h); }
    }
    g.globalAlpha = 1;
    for (const fr of frames) { g.strokeStyle = "#16181d"; g.lineWidth = 2; g.strokeRect(fr.x, fr.y, fr.w, fr.h); }
  }

  const hit = e => {
    const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    return {x, y, b: boxes.find(b => x >= b.x && x < b.x + b.w && y >= b.y && y < b.y + b.h)};
  };
  cv.onmousemove = e => {
    const {x, y, b} = hit(e);
    if (!b) { tip.style.display = "none"; return; }
    const named = native && native.names[hex(b.f[0])];
    tip.textContent = mapMode === "native"
      ? `${named ? named[0] : units[b.f[3]]} • ${hex(b.f[0])} • ${fmt(b.f[1])} B • ${nativeSet.has(hex(b.f[0])) ? "integrated" :
         b.f[2] === 100 ? "exact, waiting" : b.f[2] ? b.f[2] + "% mined" : "unmined"}`
      : `${units[b.f[3]]} • ${hex(b.f[0])} • ${fmt(b.f[1])} B • ${b.f[2]}%` + (b.f[6] ? ` • family ${b.f[6]}` : "");
    tip.style.display = "block";
    tip.style.left = Math.max(0, Math.min(x + 12, cv.clientWidth - tip.offsetWidth)) + "px";
    tip.style.top = (y + 16) + "px";
  };
  cv.onmouseleave = () => { tip.style.display = "none"; };
  cv.onclick = e => {
    const {b} = hit(e);
    if (b) showFunction(b.f);
  };
  function showFunction(f) {
    const named=native?.names[hex(f[0])], integrated=nativeSet.has(hex(f[0]));
    const readable=named && !named[0].startsWith("?") ? named[0] : "";
    document.getElementById("detail").innerHTML=`<div class="function-card"><strong>${esc(readable || units[f[3]])}</strong><br>
      <span class="function-status">${integrated ? "Integrated in linked rebuild" : f[2]===100 ? "Exact · awaiting integration" : "Not exact"}</span>
      <div class="function-meta">${hex(f[0])} · ${fmt(f[1])} bytes · ${f[2]}% matched</div>${sourceLinks(name,f)}
      ${integrated && !native?.sources?.[hex(f[0])] ? '<p class="note">Integrated source location not indexed yet.</p>' : ""}
      ${named || f[6] ? `<details><summary>Technical details</summary>${named ? `<p>Symbol <code>${esc(named[1])}</code></p>` : ""}${f[6] ? `<p>Family <code>${esc(f[6])}</code></p>` : ""}</details>` : ""}
      ${integrated ? "" : `<p class="note">Work on it: <code>roc claim ${esc(name)} ${hex(f[0])}</code></p>`}</div>`;
  }
  unitSel.onchange = layout;
  filter.oninput = () => { keep = parseFilter(filter.value, units); draw();
    if(/^(?:0x)?[0-9a-f]{8}$/i.test(filter.value.trim())) {const f=data.funcs.find(f=>hex(f[0])===filter.value.trim().toLowerCase().replace(/^0x/,""));if(f)showFunction(f);}
  };
  const modeSel = document.getElementById("mapmode");
  if (modeSel) modeSel.onchange = () => {
    mapMode = modeSel.value;
    document.getElementById("maplegend").innerHTML = mapMode === "native" ? NATIVE_LEGEND : MINING_LEGEND;
    draw();
  };
  const nativeColor = f => nativeSet.has(hex(f[0])) ? "#a855f7" : f[2] === 100 ? "#58a6ff" : f[2] ? "#d29922" : "#3a3d45";
  onresize = layout;
  layout();


  const remaining = data.funcs.filter(f => native && views.remaining==="integration" ? !nativeSet.has(hex(f[0])) : f[2]<100).sort((a, b) => b[1] - a[1] || b[2] - a[2] || a[0] - b[0]);
  let remainingPage = 0, remainingSort = 1, remainingDescending = true;
  function sortRemaining() {
    remaining.sort((a, b) => (remainingDescending ? -1 : 1) * (remainingSort === 3 ?
      units[a[3]].localeCompare(units[b[3]]) : a[remainingSort] - b[remainingSort]) || a[0] - b[0]);
  }
  function renderRemaining() {
    const pages = Math.max(1, Math.ceil(remaining.length / 25));
    remainingPage = Math.min(remainingPage, pages - 1);
    const start = remainingPage * 25;
    document.getElementById("remaining").innerHTML = remaining.slice(start, start + 25).map(f =>
      `<tr><td>${hex(f[0])}</td><td>${fmt(f[1])} B</td><td>${native && views.remaining==="integration" ? (f[2]===100 ? "Exact, waiting" : "Not exact") : `<span class="remaining-score"><i aria-hidden="true"><b style="width:${f[2]}%"></b></i>${f[2]}%</span>`}</td><td>${esc(units[f[3]])}</td>` +
      `<td>${sourceLinks(name, f, true) || '<span class="note">No source yet</span>'}</td></tr>`).join("") ||
      '<tr><td colspan="5">All functions matched.</td></tr>';
    for (const prefix of ["remaining", "remaining-top"]) {
      document.getElementById(prefix + "-page").textContent =
        `Page ${remainingPage + 1} of ${fmt(pages)} · ${remaining.length ? fmt(start + 1) : 0}–${fmt(Math.min(start + 25, remaining.length))} of ${fmt(remaining.length)} functions`;
      document.getElementById(prefix + "-prev").disabled = remainingPage === 0;
      document.getElementById(prefix + "-next").disabled = remainingPage === pages - 1;
    }
    document.querySelectorAll("[data-remaining-sort]").forEach(button =>
      button.parentElement.setAttribute("aria-sort", +button.dataset.remainingSort === remainingSort ?
        (remainingDescending ? "descending" : "ascending") : "none"));
  }
  for (const prefix of ["remaining", "remaining-top"]) {
    document.getElementById(prefix + "-prev").onclick = () => { remainingPage--; renderRemaining(); };
    document.getElementById(prefix + "-next").onclick = () => { remainingPage++; renderRemaining(); };
  }
  document.querySelectorAll("[data-remaining-sort]").forEach(button => {
    button.onclick = () => {
      const column = +button.dataset.remainingSort;
      remainingDescending = column === remainingSort ? !remainingDescending : column === 1 || column === 2;
      remainingSort = column;
      sortRemaining();
      remainingPage = 0;
      renderRemaining();
    };
  });
  function renderCode() {
    document.getElementById("live-code").innerHTML = `<div class="label">Code <small>(${mb(latest.bytes)}) — ${pct(latest.matched_bytes,latest.bytes)}</small></div>`+codeBar(latest.source_bytes,latest.mined_bytes,latest.partial_bytes,latest.bytes);
  }
  app.onclick = event => {
    const button = event.target.closest("button[data-view]");
    if (!native || !button) return;
    const key = button.dataset.view;
    views[key] = button.dataset.mode;
    document.querySelectorAll(`#${key}-mode button`).forEach(item => item.setAttribute("aria-pressed", item === button));
    if(key==="libraries") {document.getElementById("library-content").innerHTML=libraryTable(data,views.libraries==="integration",true);wireLibraries(onLibraryMap);}
    if(key==="daily") document.getElementById("live-mining").innerHTML=views.daily==="integration" ? integrationDaily(native,true) : miningGraph(latest,true);
    if(key==="remaining") {remaining.splice(0,remaining.length,...data.funcs.filter(f=>views.remaining==="integration" ? !nativeSet.has(hex(f[0])) : f[2]<100));sortRemaining();remainingPage=0;document.getElementById("remaining-title").textContent=views.remaining==="integration" ? "Functions not integrated" : "Functions Remaining";renderRemaining();}
  };
  renderCode();
  renderRemaining();
  liveView = {name, update() {
    if (hIdx !== history.length - 1) return;
    if (applyScores()) { client(name); return; }
    document.getElementById("live-matched").textContent = fmt(latest.matched);
    document.getElementById("live-partial").textContent = fmt(latest.partial);
    document.getElementById("live-remaining").textContent = fmt(latest.functions - latest.matched);
    document.getElementById("live-status").textContent = `Published snapshot · ${progress.live_updated} · checks every 30s`;
    renderCode();
    document.getElementById("live-mining").innerHTML = native && views.daily==="integration" ? integrationDaily(native,true) : miningGraph(latest,!!native);
    remaining.splice(0, remaining.length, ...data.funcs.filter(f => native && views.remaining==="integration" ? !nativeSet.has(hex(f[0])) : f[2]<100));
    sortRemaining();
    renderRemaining();
    draw();
  }};
}

const SECTIONS = ["clients", "contributors"];

function route(top = true) {
  liveView = null;
  onresize = null;
  const name = decodeURIComponent(location.hash.slice(1));
  const section = SECTIONS.includes(name);
  if (name && !section) client(name); else overview();
  document.querySelectorAll("[data-nav]").forEach(a =>
    a.classList.toggle("on", a.dataset.nav === (section ? name : name ? "clients" : "home")));
  if (section) document.getElementById(name)?.scrollIntoView();
  else if (top) scrollTo(0, 0);
}

Promise.all([
  fetch("progress.json", {cache: "no-cache"}).then(r => r.json()),
  fetch("history.json", {cache: "no-cache"}).then(r => r.ok ? r.json() : []).catch(() => []),
  fetch("source-links.json", {cache: "no-cache"}).then(r => r.ok ? r.json() : {}).catch(() => ({})),
  fetch("integration.json", {cache: "no-cache"}).then(r => r.ok ? r.json() : null).catch(() => null),
]).then(([p, h, sources, native]) => {
  sourceCatalog = sources;
  integrationData = native;
  progress = p; history = h; hIdx = h.length - 1;
  route();
  if (!progress.clients.some(c => c.name === decodeURIComponent(location.hash.slice(1)))) refreshLiveProgress();
  setInterval(() => { if (!document.hidden) refreshLiveProgress(); }, 30000);
  addEventListener("hashchange", () => route());
}).catch(() => { app.textContent = "progress.json missing: run `roc progress`."; });
</script>
</body>
</html>
