name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pefile capstone tzdata pytest -r packaging/requirements-chatgpt.txt
      - name: Run tests
        run: python -m pytest tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run frontend tests
        run: node tests/test_gui_frontend.js
      - name: Run mining graph tests
        run: node tests/test_mining_graph.js
      - name: Run live progress tests
        run: node tests/test_live_progress.js
      - name: Run integration frontend tests
        run: node tests/test_integration_frontend.js
      - name: Run dependency graph frontend tests
        run: node --test tests/graph_ui.test.js
