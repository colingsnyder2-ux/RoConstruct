name: tests

on:
  push:
    paths:
      - "workspace/**"
      - "!workspace/workspace-manifest.json"
      - "!workspace/roconstruct-package.json"
      - ".github/workflows/tests.yml"
  pull_request:

concurrency:
  group: source-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: workspace
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            workspace
            .github
          ref: ${{ (github.ref == 'refs/heads/main' || github.base_ref == 'main') && 'work' || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pefile capstone tzdata pytest -r packaging/requirements-chatgpt.txt
      - name: Run tests
        run: python -m pytest tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run frontend tests
        run: node tests/test_gui_frontend.js
      - name: Run mining graph tests
        run: node tests/test_mining_graph.js
      - name: Run live progress tests
        run: node tests/test_live_progress.js
      - name: Run integration frontend tests
        run: node tests/test_integration_frontend.js
