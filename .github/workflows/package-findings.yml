name: Package usable findings
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package sources and required metadata
        run: |
          mkdir -p dist
          (cd src && zip -qr ../dist/roconstruct-findings-src.zip .)
          zip -qr dist/roconstruct-evidence.zip data units 2008-06/verification
          zip -qr dist/roconstruct-native-source.zip 2008-06
          sha256sum dist/*.zip > dist/SHA256SUMS
      - name: Update stable source downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view findings-latest >/dev/null 2>&1 || gh release create findings-latest --title "Latest findings" --notes "Recovered sources and usable native rebuild inputs." --prerelease
          gh release upload findings-latest dist/*.zip dist/SHA256SUMS --clobber
