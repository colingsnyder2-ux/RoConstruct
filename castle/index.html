<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Castle Island — Browser Port</title>
<style>
html,body{margin:0;background:#102634;color:#e7ede9;font:15px system-ui;height:100%}
main{height:100%;display:grid;grid-template-rows:auto 1fr auto}
header,footer{padding:10px 18px}header{font-weight:650}
canvas{width:100%;height:100%;display:block;min-height:0;outline:none}
#status{font-weight:400;color:#b6cacd;margin-left:14px}
footer{font-size:13px;color:#b6cacd}
</style>
<main><header>CASTLE ISLAND <span id="status">Loading…</span></header>
<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<footer>Drag: orbit · Wheel: zoom · Space: auto-orbit · R: reset · H: HUD · W: wireframe · S: shadows · P: pause time · D: resume · T: +3 hours · C: sun/moon</footer></main>
<script>
var Module={canvas:document.querySelector('#canvas'),
 print:console.log,
 printErr:function(text){console.error(text);},
 setStatus:function(text){document.querySelector('#status').textContent=text;},
 onRuntimeInitialized:function(){document.querySelector('#status').textContent='Renderer starting…';},
 onAbort:function(reason){document.querySelector('#status').textContent='Failed: '+reason;}};
</script>
<script async type="text/javascript" src="index.js"></script>
</html>
